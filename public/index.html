n(t.requirements['accepted_extraction_types'])}\",\n                    f\"- *Excluded Extraction Types:* {', '.join(t.requirements['excluded_extraction_types'])}\",\n                    f\"- *Minimum Grouped Split:* >= {t.requirements['min_train_records']} train / >= {t.requirements['min_test_records']} test records\",\n                    \"\",\n                    \"**Reasons for Ineligibility:**\",\n                ]\n            )\n            for reason in t.reasons_not_ready:\n                lines.append(f\"- \u274c {reason}\")\n            lines.extend(\n                [\n                    \"\",\n                    \"**Additional Evidence Needed for Readiness:**\",\n                ]\n            )\n            for req in t.evidence_needed_for_readiness:\n                lines.append(f\"- \ud83d\udccb {req}\")\n            lines.append(\"\")\n\n        lines.extend(\n            [\n                \"---\",\n                \"\",\n                \"## 2. Registered Literature Sources Audit\",\n                \"\",\n                \"| Source ID | Title | Verification Status | Access Level | Review Decision | Compatibility Category | Notes |\",\n                \"|---|---|---|---|---|---|---|\",\n            ]\n        )\n        for s in self.sources_summary:\n            lines.append(\n                f\"| `{s['source_id']}` | {s['title'][:45]}... | `{s['verification_status']}` | `{s['access_level']}` | **{s['review_status']}** | `{s['compatibility_category']}` | {s['review_notes'][:60]}... |\"\n            )\n\n        lines.extend(\n            [\n                \"\",\n                \"---\",\n                \"\",\n                \"## 3. Detailed Observation Eligibility Breakdown (25 Records)\",\n                \"\",\n                \"| Record ID | Source ID | Target | Value | Unit | Fibre Species | Extraction Type | Decision | Ineligibility Rationale |\",\n                \"|---|---|---|---:|---|---|---|---|---|\",\n            ]\n        )\n        for obs in self.observation_records:\n            badge = \"Eligible\" if obs.is_eligible else \"Ineligible\"\n            reasons_str = \"; \".join(obs.reasons_ineligible) if obs.reasons_ineligible else \"Meets criteria\"\n            lines.append(\n                f\"| `{obs.record_id}` | `{obs.source_id}` | `{obs.test_type}` | {obs.measured_value} | {obs.measured_unit} | {obs.fibre_type[:20]} | `{obs.extraction_type}` | **{badge}** | {reasons_str} |\"\n            )\n\n        lines.extend(\n            [\n                \"\",\n                \"---\",\n                \"\",\n                \"## 4. Summary of Scientific Safeguards\",\n                \"\",\n                \"1. **No Artificial Data Infiltration:** Test fixtures are strictly isolated in `tests/fixtures/` and rejected if placed in data folders.\",\n                \"2. **Evidence-Type Segregation:** Graph estimates and unspecified reported values are preserved for provenance but blocked from ML training.\",\n                \"3. **Zero Cross-Species Mixing:** Water hyacinth and bamboo evidence are maintained in separate bundles and never pooled into *Ipomoea carnea* predictions.\",\n                \"4. **Grouped Leakage Prevention:** Holds entire source or batch groups out during evaluation to prevent optimistic performance overestimation.\",\n                \"\",\n            ]\n        )\n        return \"\\n\".join(lines) + \"\\n\"\n\n    def write_markdown(self, path: str | Path) -> Path:\n        dest = Path(path)\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        dest.write_text(self.to_markdown(), encoding=\"utf-8\")\n        return dest\n\n\ndef build_eligibility_audit(project_root: str | Path = \".\") -> EligibilityAuditReport:\n    \"\"\"Conduct comprehensive evidence eligibility audit across sources and observations.\"\"\"\n    root = Path(project_root).resolve()\n    register_path = root / \"data\" / \"raw\" / \"literature\" / \"source_register.csv\"\n    observations_path = root / \"data\" / \"raw\" / \"literature\" / \"literature_observations.csv\"\n\n    register = load_csv(register_path) if register_path.is_file() else pd.DataFrame()\n    observations = load_csv(observations_path) if observations_path.is_file() else pd.DataFrame()\n\n    lit_review = review_literature(root)\n\n    sources_summary = [\n        {\n            \"source_id\": str(row.get(\"source_id\", \"\")).strip(),\n            \"title\": str(row.get(\"title\", \"\")).strip(),\n            \"verification_status\": str(row.get(\"verification_status\", \"\")).strip(),\n            \"access_level\": str(row.get(\"access_level\", \"\")).strip(),\n            \"review_status\": str(row.get(\"review_status\", \"\")).strip(),\n            \"compatibility_category\": str(row.get(\"compatibility_category\", \"\")).strip(),\n            \"review_notes\": str(row.get(\"review_notes\", \"\")).strip(),\n        }\n        for _, row in register.iterrows()\n    ]\n\n    source_register_map = {\n        str(row.get(\"source_id\", \"\")).strip(): row\n        for _, row in register.iterrows()\n    }\n\n    obs_records: list[ObservationAuditRecord] = []\n    for _, row in observations.iterrows():\n        rec_id = str(row.get(\"record_id\", \"\")).strip()\n        src_id = str(row.get(\"source_id\", \"\")).strip()\n        test_type = str(row.get(\"test_type\", \"\")).strip()\n        val = str(row.get(\"measured_value\", \"\")).strip()\n        unit = str(row.get(\"measured_unit\", \"\")).strip()\n        fibre = str(row.get(\"fibre_type\", \"\")).strip()\n        matrix = str(row.get(\"matrix_type\", \"\")).strip()\n        ext_type = str(row.get(\"extraction_type\", \"\")).strip()\n        rev_status = str(row.get(\"review_status\", \"\")).strip()\n        comp_cat = str(row.get(\"compatibility_category\", \"\")).strip()\n\n        reasons: list[str] = []\n        source_row = source_register_map.get(src_id)\n\n        if source_row is None:\n            reasons.append(\"Source ID is not found in source register\")\n        else:\n            s_rev = str(source_row.get(\"review_status\", \"\")).strip()\n            s_comp = str(source_row.get(\"compatibility_category\", \"\")).strip()\n            s_ver = str(source_row.get(\"verification_status\", \"\")).strip()\n            if s_rev != \"accepted\":\n                reasons.append(f\"Source review status is '{s_rev}' (not accepted)\")\n            if s_comp != \"directly comparable\":\n                reasons.append(f\"Source compatibility category is '{s_comp}' (not directly comparable)\")\n            if s_ver == \"unverified\":\n                reasons.append(\"Source metadata/content is unverified\")\n\n        if rev_status != \"accepted\":\n            reasons.append(f\"Observation review status is '{rev_status}' (not accepted)\")\n        if comp_cat != \"directly comparable\":\n            reasons.append(f\"Observation compatibility category is '{comp_cat}' (not directly comparable)\")\n        if ext_type not in MODEL_ELIGIBLE_EXTRACTION_TYPES:\n            reasons.append(f\"Extraction type '{ext_type}' is evidence-only (must be individual/reported_mean/reported_range)\")\n\n        if \"Ipomoea carnea\" not in fibre:\n            reasons.append(f\"Incompatible fibre species '{fibre}' (target species is Ipomoea carnea)\")\n        if \"matrix-only\" in fibre.lower():\n            reasons.append(\"Matrix-only baseline, not a composite measurement\")\n\n        if \"Conflict\" in str(row.get(\"notes\", \"\")):\n            reasons.append(\"Unresolved conflict between paper text and figure\")\n\n        is_eligible = len(reasons) == 0\n        obs_records.append(\n            ObservationAuditRecord(\n                record_id=rec_id,\n                source_id=src_id,\n                test_type=test_type,\n                measured_value=val,\n                measured_unit=unit,\n                fibre_type=fibre,\n                matrix_type=matrix,\n                extraction_type=ext_type,\n                review_status=rev_status,\n                compatibility_category=comp_cat,\n                is_eligible=is_eligible,\n                reasons_ineligible=reasons,\n            )\n        )\n\n    target_summaries: dict[str, TargetAuditSummary] = {}\n    for target_name in sorted(TEST_TYPES):\n        reqs = TARGET_REQUIREMENTS[target_name]\n        target_obs = [r for r in obs_records if r.test_type == target_name]\n        target_eligible = [r for r in target_obs if r.is_eligible]\n\n        reasons_not_ready: list[str] = []\n        if len(target_obs) == 0:\n            reasons_not_ready.append(\"Zero raw observations found for this target property.\")\n        if len(target_eligible) < MINIMUM_MODEL_RECORDS:\n            reasons_not_ready.append(\n                f\"Accepted compatible observations ({len(target_eligible)}) below threshold of {MINIMUM_MODEL_RECORDS}.\"\n            )\n\n        lit_target_readiness = lit_review.readiness.get(target_name, {})\n        ind_groups = lit_target_readiness.get(\"independent_groups\", 0)\n        if ind_groups < MINIMUM_INDEPENDENT_GROUPS:\n            reasons_not_ready.append(\n                f\"Independent source/batch groups ({ind_groups}) below required minimum of {MINIMUM_INDEPENDENT_GROUPS}.\"\n            )\n\n        evidence_needed = [\n            f\"At least {MINIMUM_MODEL_RECORDS} compatible specimen or mean observations with verified '{reqs['canonical_unit']}' units.\",\n            f\"At least {MINIMUM_INDEPENDENT_GROUPS} independent experimental batches or peer-reviewed publication sources.\",\n            \"Primary peer-reviewed publications with full-text verified Ipomoea carnea composites.\",\n            f\"Standardized testing under recognized protocols ({', '.join(reqs['standard_test_methods'])}).\",\n            \"Explicit reporting of fibre loading wt%, NaOH concentration %, treatment time, and polymer matrix formulation.\",\n        ]\n\n        target_summaries[target_name] = TargetAuditSummary(\n            target=target_name,\n            canonical_unit=reqs[\"canonical_unit\"],\n            supported_units=reqs[\"supported_units\"],\n            total_observations_found=len(target_obs),\n            accepted_compatible_observations=len(target_eligible),\n            independent_groups=ind_groups,\n            model_ready=len(reasons_not_ready) == 0,\n            requirements=reqs,\n            reasons_not_ready=reasons_not_ready,\n            evidence_needed_for_readiness=evidence_needed,\n        )\n\n    unready_count = sum(1 for t in target_summaries.values() if not t.model_ready)\n    verdict = (\n        \"Dataset insufficient for scientific ML training. Strict gates intact. Zero false claims.\"\n        if unready_count == 4\n        else f\"{len(target_summaries) - unready_count} target(s) ready.\"\n    )\n\n    return EligibilityAuditReport(\n        project_root=str(root),\n        total_registered_sources=len(register),\n        total_normalized_observations=len(observations),\n        total_accepted_compatible_observations=sum(\n            t.accepted_compatible_observations for t in target_summaries.values()\n        ),\n        unready_target_count=unready_count,\n        targets=target_summaries,\n        observation_records=obs_records,\n        sources_summary=sources_summary,\n        audit_verdict=verdict,\n    )\n",
  "ecofiber_ai/eligibility.py": "\"\"\"Evidence eligibility audit for literature sources and observations.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom dataclasses import asdict, dataclass, field\nfrom pathlib import Path\nfrom typing import Any\n\nimport pandas as pd\n\nfrom ecofiber_ai.audit import MINIMUM_INDEPENDENT_GROUPS, MINIMUM_MODEL_RECORDS\nfrom ecofiber_ai.literature import (\n    MODEL_ELIGIBLE_EXTRACTION_TYPES,\n    review_literature,\n)\nfrom ecofiber_ai.modeling import MINIMUM_TEST_RECORDS, MINIMUM_TRAIN_RECORDS\nfrom ecofiber_ai.schema import SUPPORTED_UNITS, TEST_TYPES, canonical_unit\nfrom ecofiber_ai.validation import load_csv\n\nTARGET_REQUIREMENTS: dict[str, dict[str, Any]] = {\n    \"tensile_strength\": {\n        \"canonical_unit\": \"MPa\",\n        \"supported_units\": [\"MPa\"],\n        \"required_matrix\": \"epoxy (or single consistent polymer matrix)\",\n        \"required_fibre\": \"Ipomoea carnea (single non-hybrid species)\",\n        \"standard_test_methods\": [\"ASTM D3039\", \"ASTM D638\", \"ISO 527\"],\n        \"min_compatible_observations\": MINIMUM_MODEL_RECORDS,\n        \"min_independent_groups\": MINIMUM_INDEPENDENT_GROUPS,\n        \"min_train_records\": MINIMUM_TRAIN_RECORDS,\n        \"min_test_records\": MINIMUM_TEST_RECORDS,\n        \"accepted_extraction_types\": sorted(MODEL_ELIGIBLE_EXTRACTION_TYPES),\n        \"excluded_extraction_types\": [\"graph_estimate\", \"inferred\", \"reported_value\"],\n    },\n    \"flexural_strength\": {\n        \"canonical_unit\": \"MPa\",\n        \"supported_units\": [\"MPa\"],\n        \"required_matrix\": \"epoxy (or single consistent polymer matrix)\",\n        \"required_fibre\": \"Ipomoea carnea (single non-hybrid species)\",\n        \"standard_test_methods\": [\"ASTM D790\", \"ISO 178\"],\n        \"min_compatible_observations\": MINIMUM_MODEL_RECORDS,\n        \"min_independent_groups\": MINIMUM_INDEPENDENT_GROUPS,\n        \"min_train_records\": MINIMUM_TRAIN_RECORDS,\n        \"min_test_records\": MINIMUM_TEST_RECORDS,\n        \"accepted_extraction_types\": sorted(MODEL_ELIGIBLE_EXTRACTION_TYPES),\n        \"excluded_extraction_types\": [\"graph_estimate\", \"inferred\", \"reported_value\"],\n    },\n    \"impact_resistance\": {\n        \"canonical_unit\": \"kJ/m^2 (or J/m; kept separate without cross-conversion)\",\n        \"supported_units\": [\"kJ/m^2\", \"J/m\"],\n        \"required_matrix\": \"epoxy (or single consistent polymer matrix)\",\n        \"required_fibre\": \"Ipomoea carnea (single non-hybrid species)\",\n        \"standard_test_methods\": [\"ASTM D256\", \"ASTM D6110\", \"ISO 179\", \"ISO 180\"],\n        \"min_compatible_observations\": MINIMUM_MODEL_RECORDS,\n        \"min_independent_groups\": MINIMUM_INDEPENDENT_GROUPS,\n        \"min_train_records\": MINIMUM_TRAIN_RECORDS,\n        \"min_test_records\": MINIMUM_TEST_RECORDS,\n        \"accepted_extraction_types\": sorted(MODEL_ELIGIBLE_EXTRACTION_TYPES),\n        \"excluded_extraction_types\": [\"graph_estimate\", \"inferred\", \"reported_value\"],\n    },\n    \"water_absorption\": {\n        \"canonical_unit\": \"%\",\n        \"supported_units\": [\"%\"],\n        \"required_matrix\": \"epoxy (or single consistent polymer matrix)\",\n        \"required_fibre\": \"Ipomoea carnea (single non-hybrid species)\",\n        \"standard_test_methods\": [\"ASTM D570\", \"ISO 62\"],\n        \"min_compatible_observations\": MINIMUM_MODEL_RECORDS,\n        \"min_independent_groups\": MINIMUM_INDEPENDENT_GROUPS,\n        \"min_train_records\": MINIMUM_TRAIN_RECORDS,\n        \"min_test_records\": MINIMUM_TEST_RECORDS,\n        \"accepted_extraction_types\": sorted(MODEL_ELIGIBLE_EXTRACTION_TYPES),\n        \"excluded_extraction_types\": [\"graph_estimate\", \"inferred\", \"reported_value\"],\n    },\n}\n\n\n@dataclass\nclass ObservationAuditRecord:\n    \"\"\"Detailed eligibility assessment for one normalized observation.\"\"\"\n\n    record_id: str\n    source_id: str\n    test_type: str\n    measured_value: str\n    measured_unit: str\n    fibre_type: str\n    matrix_type: str\n    extraction_type: str\n    review_status: str\n    compatibility_category: str\n    is_eligible: bool\n    reasons_ineligible: list[str] = field(default_factory=list)\n\n\n@dataclass\nclass TargetAuditSummary:\n    \"\"\"Eligibility status and gap analysis for one target property.\"\"\"\n\n    target: str\n    canonical_unit: str\n    supported_units: list[str]\n    total_observations_found: int\n    accepted_compatible_observations: int\n    independent_groups: int\n    model_ready: bool\n    requirements: dict[str, Any]\n    reasons_not_ready: list[str]\n    evidence_needed_for_readiness: list[str]\n\n\n@dataclass\nclass EligibilityAuditReport:\n    \"\"\"Comprehensive scientific evidence eligibility audit.\"\"\"\n\n    project_root: str\n    total_registered_sources: int\n    total_normalized_observations: int\n    total_accepted_compatible_observations: int\n    unready_target_count: int\n    targets: dict[str, TargetAuditSummary]\n    observation_records: list[ObservationAuditRecord]\n    sources_summary: list[dict[str, str]]\n    audit_verdict: str\n\n    def to_dict(self) -> dict[str, Any]:\n        return asdict(self)\n\n    def write_json(self, path: str | Path) -> Path:\n        dest = Path(path)\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        dest.write_text(\n            json.dumps(self.to_dict(), indent=2, ensure_ascii=False) + \"\\n\",\n            encoding=\"utf-8\",\n        )\n        return dest\n\n    def to_markdown(self) -> str:\n        lines = [\n            \"# EcoFiber AI \u2014 Evidence Eligibility & Scientific Audit Report\",\n            \"\",\n            f\"- **Project Root:** `{self.project_root}`\",\n            f\"- **Registered Literature Sources:** {self.total_registered_sources}\",\n            f\"- **Normalized Extracted Observations:** {self.total_normalized_observations}\",\n            f\"- **Accepted Directly Compatible Observations:** {self.total_accepted_compatible_observations}\",\n            f\"- **Unready Targets:** {self.unready_target_count} of {len(self.targets)}\",\n            f\"- **Audit Verdict:** **{self.audit_verdict}**\",\n            \"\",\n            \"> [!IMPORTANT]\",\n            \"> Eligibility rules are strictly enforced to preserve scientific integrity. No unverified, \"\n            \"> pending, incompatible-species, or evidence-only (graph estimate / unspecified statistic) \"\n            \"> observation is permitted into model training.\",\n            \"\",\n            \"---\",\n            \"\",\n            \"## 1. Target-by-Target Eligibility & Readiness Assessment\",\n            \"\",\n        ]\n\n        for target_name in sorted(self.targets):\n            t = self.targets[target_name]\n            status_badge = \"\ud83d\udfe2 READY\" if t.model_ready else \"\ud83d\udd34 NOT READY\"\n            lines.extend(\n                [\n                    f\"### `{target_name}` ({status_badge})\",\n                    \"\",\n                    f\"- **Canonical Unit:** `{t.canonical_unit}` (Supported: {', '.join(t.supported_units)})\",\n                    f\"- **Total Raw Observations:** {t.total_observations_found}\",\n                    f\"- **Accepted Compatible Observations:** {t.accepted_compatible_observations} (Required: >= {MINIMUM_MODEL_RECORDS})\",\n                    f\"- **Independent Groups:** {t.independent_groups} (Required: >= {MINIMUM_INDEPENDENT_GROUPS})\",\n                    \"\",\n                    \"**Eligibility & Compatibility Requirements:**\",\n                    f\"- *Fibre Species:* {t.requirements['required_fibre']}\",\n                    f\"- *Polymer Matrix:* {t.requirements['required_matrix']}\",\n                    f\"- *Accepted Standards:* {', '.join(t.requirements['standard_test_methods'])}\",\n                    f\"- *Accepted Extraction Types:* {', '.join(t.requirements['accepted_extraction_types'])}\",\n                    f\"- *Excluded Extraction Types:* {', '.join(t.requirements['excluded_extraction_types'])}\",\n                    f\"- *Minimum Grouped Split:* >= {t.requirements['min_train_records']} train / >= {t.requirements['min_test_records']} test records\",\n                    \"\",\n                    \"**Reasons for Ineligibility:**\",\n                ]\n            )\n            for reason in t.reasons_not_ready:\n                lines.append(f\"- \u274c {reason}\")\n            lines.extend(\n                [\n                    \"\",\n                    \"**Additional Evidence Needed for Readiness:**\",\n                ]\n            )\n            for req in t.evidence_needed_for_readiness:\n                lines.append(f\"- \ud83d\udccb {req}\")\n            lines.append(\"\")\n\n        lines.extend(\n            [\n                \"---\",\n                \"\",\n                \"## 2. Registered Literature Sources Audit\",\n                \"\",\n                \"| Source ID | Title | Verification Status | Access Level | Review Decision | Compatibility Category | Notes |\",\n                \"|---|---|---|---|---|---|---|\",\n            ]\n        )\n        for s in self.sources_summary:\n            lines.append(\n                f\"| `{s['source_id']}` | {s['title'][:45]}... | `{s['verification_status']}` | `{s['access_level']}` | **{s['review_status']}** | `{s['compatibility_category']}` | {s['review_notes'][:60]}... |\"\n            )\n\n        lines.extend(\n            [\n                \"\",\n                \"---\",\n                \"\",\n                \"## 3. Detailed Observation Eligibility Breakdown (25 Records)\",\n                \"\",\n                \"| Record ID | Source ID | Target | Value | Unit | Fibre Species | Extraction Type | Decision | Ineligibility Rationale |\",\n                \"|---|---|---|---:|---|---|---|---|---|\",\n            ]\n        )\n        for obs in self.observation_records:\n            badge = \"Eligible\" if obs.is_eligible else \"Ineligible\"\n            reasons_str = \"; \".join(obs.reasons_ineligible) if obs.reasons_ineligible else \"Meets criteria\"\n            lines.append(\n                f\"| `{obs.record_id}` | `{obs.source_id}` | `{obs.test_type}` | {obs.measured_value} | {obs.measured_unit} | {obs.fibre_type[:20]} | `{obs.extraction_type}` | **{badge}** | {reasons_str} |\"\n            )\n\n        lines.extend(\n            [\n                \"\",\n                \"---\",\n                \"\",\n                \"## 4. Summary of Scientific Safeguards\",\n                \"\",\n                \"1. **No Artificial Data Infiltration:** Test fixtures are strictly isolated in `tests/fixtures/` and rejected if placed in data folders.\",\n                \"2. **Evidence-Type Segregation:** Graph estimates and unspecified reported values are preserved for provenance but blocked from ML training.\",\n                \"3. **Zero Cross-Species Mixing:** Water hyacinth and bamboo evidence are maintained in separate bundles and never pooled into *Ipomoea carnea* predictions.\",\n                \"4. **Grouped Leakage Prevention:** Holds entire source or batch groups out during evaluation to prevent optimistic performance overestimation.\",\n                \"\",\n            ]\n        )\n        return \"\\n\".join(lines) + \"\\n\"\n\n    def write_markdown(self, path: str | Path) -> Path:\n        dest = Path(path)\n        dest.parent.mkdir(parents=True, exist_ok=True)\n        dest.write_text(self.to_markdown(), encoding=\"utf-8\")\n        return dest\n\n\ndef build_eligibility_audit(project_root: str | Path = \".\") -> EligibilityAuditReport:\n    \"\"\"Conduct comprehensive evidence eligibility audit across sources and observations.\"\"\"\n    root = Path(project_root).resolve()\n    register_path = root / \"data\" / \"raw\" / \"literature\" / \"source_register.csv\"\n    observations_path = root / \"data\" / \"raw\" / \"literature\" / \"literature_observations.csv\"\n\n    register = load_csv(register_path) if register_path.is_file() else pd.DataFrame()\n    observations = load_csv(observations_path) if observations_path.is_file() else pd.DataFrame()\n\n    lit_review = review_literature(root)\n\n    sources_summary = [\n        {\n            \"source_id\": str(row.get(\"source_id\", \"\")).strip(),\n            \"title\": str(row.get(\"title\", \"\")).strip(),\n            \"verification_status\": str(row.get(\"verification_status\", \"\")).strip(),\n            \"access_level\": str(row.get(\"access_level\", \"\")).strip(),\n            \"review_status\": str(row.get(\"review_status\", \"\")).strip(),\n            \"compatibility_category\": str(row.get(\"compatibility_category\", \"\")).strip(),\n            \"review_notes\": str(row.get(\"review_notes\", \"\")).strip(),\n        }\n        for _, row in register.iterrows()\n    ]\n\n    source_register_map = {\n        str(row.get(\"source_id\", \"\")).strip(): row\n        for _, row in register.iterrows()\n    }\n\n    obs_records: list[ObservationAuditRecord] = []\n    for _, row in observations.iterrows():\n        rec_id = str(row.get(\"record_id\", \"\")).strip()\n        src_id = str(row.get(\"source_id\", \"\")).strip()\n        test_type = str(row.get(\"test_type\", \"\")).strip()\n        val = str(row.get(\"measured_value\", \"\")).strip()\n        unit = str(row.get(\"measured_unit\", \"\")).strip()\n        fibre = str(row.get(\"fibre_type\", \"\")).strip()\n        matrix = str(row.get(\"matrix_type\", \"\")).strip()\n        ext_type = str(row.get(\"extraction_type\", \"\")).strip()\n        rev_status = str(row.get(\"review_status\", \"\")).strip()\n        comp_cat = str(row.get(\"compatibility_category\", \"\")).strip()\n\n        reasons: list[str] = []\n        source_row = source_register_map.get(src_id)\n\n        if source_row is None:\n            reasons.append(\"Source ID is not found in source register\")\n        else:\n            s_rev = str(source_row.get(\"review_status\", \"\")).strip()\n            s_comp = str(source_row.get(\"compatibility_category\", \"\")).strip()\n            s_ver = str(source_row.get(\"verification_status\", \"\")).strip()\n            if s_rev != \"accepted\":\n                reasons.append(f\"Source review status is '{s_rev}' (not accepted)\")\n            if s_comp != \"directly comparable\":\n                reasons.append(f\"Source compatibility category is '{s_comp}' (not directly comparable)\")\n            if s_ver == \"unverified\":\n                reasons.append(\"Source metadata/content is unverified\")\n\n        if rev_status != \"accepted\":\n            reasons.append(f\"Observation review status is '{rev_status}' (not accepted)\")\n        if comp_cat != \"directly comparable\":\n            reasons.append(f\"Observation compatibility category is '{comp_cat}' (not directly comparable)\")\n        if ext_type not in MODEL_ELIGIBLE_EXTRACTION_TYPES:\n            reasons.append(f\"Extraction type '{ext_type}' is evidence-only (must be individual/reported_mean/reported_range)\")\n\n        if \"Ipomoea carnea\" not in fibre:\n            reasons.append(f\"Incompatible fibre species '{fibre}' (target species is Ipomoea carnea)\")\n        if \"matrix-only\" in fibre.lower():\n            reasons.append(\"Matrix-only baseline, not a composite measurement\")\n\n        if \"Conflict\" in str(row.get(\"notes\", \"\")):\n            reasons.append(\"Unresolved conflict between paper text and figure\")\n\n        is_eligible = len(reasons) == 0\n        obs_records.append(\n            ObservationAuditRecord(\n                record_id=rec_id,\n                source_id=src_id,\n                test_type=test_type,\n                measured_value=val,\n                measured_unit=unit,\n                fibre_type=fibre,\n                matrix_type=matrix,\n                extraction_type=ext_type,\n                review_status=rev_status,\n                compatibility_category=comp_cat,\n                is_eligible=is_eligible,\n                reasons_ineligible=reasons,\n            )\n        )\n\n    target_summaries: dict[str, TargetAuditSummary] = {}\n    for target_name in sorted(TEST_TYPES):\n        reqs = TARGET_REQUIREMENTS[target_name]\n        target_obs = [r for r in obs_records if r.test_type == target_name]\n        target_eligible = [r for r in target_obs if r.is_eligible]\n\n        reasons_not_ready: list[str] = []\n        if len(target_obs) == 0:\n            reasons_not_ready.append(\"Zero raw observations found for this target property.\")\n        if len(target_eligible) < MINIMUM_MODEL_RECORDS:\n            reasons_not_ready.append(\n                f\"Accepted compatible observations ({len(target_eligible)}) below threshold of {MINIMUM_MODEL_RECORDS}.\"\n            )\n\n        lit_target_readiness = lit_review.readiness.get(target_name, {})\n        ind_groups = lit_target_readiness.get(\"independent_groups\", 0)\n        if ind_groups < MINIMUM_INDEPENDENT_GROUPS:\n            reasons_not_ready.append(\n                f\"Independent source/batch groups ({ind_groups}) below required minimum of {MINIMUM_INDEPENDENT_GROUPS}.\"\n            )\n\n        evidence_needed = [\n            f\"At least {MINIMUM_MODEL_RECORDS} compatible specimen or mean observations with verified '{reqs['canonical_unit']}' units.\",\n            f\"At least {MINIMUM_INDEPENDENT_GROUPS} independent experimental batches or peer-reviewed publication sources.\",\n            \"Primary peer-reviewed publications with full-text verified Ipomoea carnea composites.\",\n            f\"Standardized testing under recognized protocols ({', '.join(reqs['standard_test_methods'])}).\",\n            \"Explicit reporting of fibre loading wt%, NaOH concentration %, treatment time, and polymer matrix formulation.\",\n        ]\n\n        target_summaries[target_name] = TargetAuditSummary(\n            target=target_name,\n            canonical_unit=reqs[\"canonical_unit\"],\n            supported_units=reqs[\"supported_units\"],\n            total_observations_found=len(target_obs),\n            accepted_compatible_observations=len(target_eligible),\n            independent_groups=ind_groups,\n            model_ready=len(reasons_not_ready) == 0,\n            requirements=reqs,\n            reasons_not_ready=reasons_not_ready,\n            evidence_needed_for_readiness=evidence_needed,\n        )\n\n    unready_count = sum(1 for t in target_summaries.values() if not t.model_ready)\n    verdict = (\n        \"Dataset insufficient for scientific ML training. Strict gates intact. Zero false claims.\"\n        if unready_count == 4\n        else f\"{len(target_summaries) - unready_count} target(s) ready.\"\n    )\n\n    return EligibilityAuditReport(\n        project_root=str(root),\n        total_registered_sources=len(register),\n        total_normalized_observations=len(observations),\n        total_accepted_compatible_observations=sum(\n            t.accepted_compatible_observations for t in target_summaries.values()\n        ),\n        unready_target_count=unready_count,\n        targets=target_summaries,\n        observation_records=obs_records,\n        sources_summary=sources_summary,\n        audit_verdict=verdict,\n    )\n",
  "src/ecofiber_ai/experimental.py": "\"\"\"Quality review for experimental observation CSVs.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom collections import defaultdict\nfrom dataclasses import asdict, dataclass\nfrom pathlib import Path\nfrom typing import Any\n\nimport pandas as pd\n\nfrom ecofiber_ai.audit import (\n    MINIMUM_INDEPENDENT_GROUPS,\n    MINIMUM_MODEL_RECORDS,\n    is_test_fixture,\n)\nfrom ecofiber_ai.schema import CANONICAL_COLUMNS, TEST_TYPES, canonical_unit\nfrom ecofiber_ai.validation import CSVLoadError, load_csv, validate_dataframe\n\nEXPERIMENTAL_METADATA_COLUMNS = (\n    \"replicate_id\",\n    \"resin_hardener_ratio\",\n    \"curing_temperature_c\",\n    \"curing_time_h\",\n    \"measurement_date\",\n    \"measurement_source\",\n)\nREVIEW_FIELDS = (\n    \"specimen_id\",\n    \"batch_id\",\n    \"fibre_type\",\n    \"matrix_type\",\n    \"treatment_method\",\n    \"naoh_concentration_pct\",\n    \"fibre_loading_wt_pct\",\n    \"fabrication_method\",\n    \"test_standard\",\n    \"measurement_date\",\n    \"measurement_source\",\n)\n\n\n@dataclass(frozen=True)\nclass RecordDecision:\n    \"\"\"Quality status and reasons for one original row.\"\"\"\n\n    record_id: str\n    specimen_id: str\n    test_type: str\n    status: str\n    reasons: tuple[str, ...]\n\n\n@dataclass\nclass ExperimentalQualityReport:\n    \"\"\"Data quality counts and per-target readiness for an input file.\"\"\"\n\n    source_file: str\n    record_count: int\n    accepted_count: int\n    review_count: int\n    rejected_count: int\n    decisions: list[RecordDecision]\n    target_readiness: dict[str, dict[str, Any]]\n    dataset_unit_consistency: dict[str, list[str]]\n    raw_file_preserved: bool\n\n    def to_dict(self) -> dict[str, Any]:\n        result = asdict(self)\n        result[\"decisions\"] = [asdict(decision) for decision in self.decisions]\n        return result\n\n    def to_markdown(self) -> str:\n        lines = [\n            \"# Experimental data quality review\",\n            \"\",\n            f\"- Input: `{self.source_file}`\",\n            f\"- Records: {self.record_count}\",\n            f\"- Accepted: {self.accepted_count}\",\n            f\"- Requires review: {self.review_count}\",\n            f\"- Rejected: {self.rejected_count}\",\n            f\"- Raw input preserved: {'yes' if self.raw_file_preserved else 'no'}\",\n            \"\",\n            \"## Target readiness\",\n            \"\",\n            \"| Target | Observations | Accepted | Unique specimens | Independent batches/groups | Units | Status | Reasons |\",\n            \"|---|---:|---:|---:|---:|---|---|---|\",\n        ]\n        for target in sorted(TEST_TYPES):\n            item = self.target_readiness[target]\n            lines.append(\n                f\"| `{target}` | {item['observation_count']} | \"\n                f\"{item['accepted_observation_count']} | \"\n                f\"{item['unique_specimen_count']} | {item['independent_group_count']} | \"\n                f\"{', '.join(item['units']) or 'none'} | {item['status']} | \"\n                f\"{'; '.join(item['reasons']) or 'none'} |\"\n            )\n        lines.extend([\"\", \"## Record decisions\", \"\"])\n        if not self.decisions:\n            lines.append(\"No observation records were supplied.\")\n        for decision in self.decisions:\n            detail = \"; \".join(decision.reasons) or \"no review findings\"\n            lines.append(\n                f\"- `{decision.record_id or '(missing record_id)'}` \"\n                f\"(specimen `{decision.specimen_id or '(missing)'}`, \"\n                f\"{decision.test_type or 'unknown property'}): \"\n                f\"**{decision.status}** \u2014 {detail}\"\n            )\n        return \"\\n\".join(lines) + \"\\n\"\n\n    def write(self, directory: str | Path) -> tuple[Path, Path]:\n        destination = Path(directory)\n        destination.mkdir(parents=True, exist_ok=True)\n        markdown_path = destination / \"experimental_quality_review.md\"\n        json_path = destination / \"experimental_quality_review.json\"\n        markdown_path.write_text(self.to_markdown(), encoding=\"utf-8\")\n        json_path.write_text(\n            json.dumps(self.to_dict(), indent=2, ensure_ascii=False) + \"\\n\",\n            encoding=\"utf-8\",\n        )\n        return markdown_path, json_path\n\n\ndef _present(value: Any) -> bool:\n    return not pd.isna(value) and bool(str(value).strip())\n\n\ndef _text(value: Any) -> str:\n    return \"\" if not _present(value) else str(value).strip()\n\n\ndef _build_target_readiness(\n    frame: pd.DataFrame,\n    decisions: list[RecordDecision],\n    target: str,\n) -> dict[str, Any]:\n    selected = frame.loc[\n        frame.get(\"test_type\", pd.Series(index=frame.index, dtype=\"string\"))\n        .astype(str)\n        .str.strip()\n        .eq(target)\n    ]\n    if \"source_type\" in selected.columns:\n        selected = selected.loc[\n            selected[\"source_type\"].astype(str).str.strip().eq(\"experimental\")\n        ]\n    accepted_ids = {\n        decision.record_id\n        for decision in decisions\n        if decision.status == \"accepted\"\n    }\n    target_ids = selected.get(\"record_id\", pd.Series(index=selected.index, dtype=\"string\"))\n    accepted = selected.loc[target_ids.astype(str).isin(accepted_ids)]\n    specimens = {\n        _text(value) for value in selected.get(\"specimen_id\", [])\n        if _present(value)\n    }\n    batches = {\n        _text(value) for value in selected.get(\"batch_id\", [])\n        if _present(value)\n    }\n    accepted_batches = {\n        _text(value) for value in accepted.get(\"batch_id\", [])\n        if _present(value)\n    }\n    units = sorted(\n        {\n            canonical_unit(_text(value)) or _text(value)\n            for value in selected.get(\"measured_unit\", [])\n            if _present(value)\n        }\n    )\n    missing = {\n        field: int(sum(not _present(value) for value in selected.get(field, [])))\n        for field in REVIEW_FIELDS\n    }\n    reasons: list[str] = []\n    if accepted.empty:\n        reasons.append(\"no accepted real observations for this target\")\n    if len(accepted) < MINIMUM_MODEL_RECORDS:\n        reasons.append(\n            f\"fewer than {MINIMUM_MODEL_RECORDS} accepted observations ({len(accepted)})\"\n        )\n    if len(accepted_batches) < MINIMUM_INDEPENDENT_GROUPS:\n        reasons.append(\n            f\"fewer than {MINIMUM_INDEPENDENT_GROUPS} independent accepted batch groups \"\n            f\"({len(accepted_batches)})\"\n        )\n    if selected.shape[0] and len(units) != 1:\n        reasons.append(\"accepted target observations do not have one consistent unit\")\n    if any(missing[field] for field in (\"test_standard\", \"fabrication_method\")):\n        reasons.append(\"test standard or fabrication metadata is missing\")\n    return {\n        \"observation_count\": len(selected),\n        \"accepted_observation_count\": len(accepted),\n        \"unique_specimen_count\": len(specimens),\n        \"independent_group_count\": len(batches),\n        \"accepted_independent_group_count\": len(accepted_batches),\n        \"units\": units,\n        \"missing_metadata_counts\": missing,\n        \"status\": \"potentially ready\" if not reasons else \"not ready\",\n        \"reasons\": reasons,\n    }\n\n\ndef review_experimental_csv(path: str | Path) -> ExperimentalQualityReport:\n    \"\"\"Review input records without modifying, dropping, or rewriting the CSV.\"\"\"\n    source = Path(path)\n    try:\n        frame = load_csv(source)\n    except CSVLoadError:\n        raise\n\n    validation = validate_dataframe(frame)\n    fixture = is_test_fixture(frame, source)\n    reasons_by_row: dict[int, list[str]] = defaultdict(list)\n    rejected_rows: set[int] = set()\n    id_to_rows: dict[str, list[int]] = defaultdict(list)\n    for index, row in frame.iterrows():\n n_id and test_type:\n            specimen_test_rows[(specimen_id, test_type, unit, replicate_id)].append(index)\n\n    for key, indices in specimen_test_rows.items():\n        if len(indices) < 2:\n            continue\n        values = {\n            pd.to_numeric(\n                pd.Series([frame.loc[index].get(\"measured_value\", \"\")]),\n                errors=\"coerce\",\n            ).iloc[0]\n            for index in indices\n        }\n        record_ids = [ _text(frame.loc[index].get(\"record_id\", \"\")) for index in indices ]\n        if len(values) == 1:\n            label = \"duplicate specimen/property/replicate measurement\"\n            for index in indices:\n                reasons_by_row[index].append(label)\n                rejected_rows.add(index)\n        else:\n            label = \"conflicting values for the same specimen/property/replicate\"\n            for index in indices:\n                reasons_by_row[index].append(label)\n\n    unit_consistency: dict[str, list[str]] = {}\n    if \"test_type\" in frame.columns and \"measured_unit\" in frame.columns:\n        for target in sorted(TEST_TYPES):\n            units = sorted(\n                {\n                    canonical_unit(_text(value)) or _text(value)\n                    for value in frame.loc[\n                        frame[\"test_type\"].astype(str).str.strip().eq(target),\n                        \"measured_unit\",\n                    ].tolist()\n                    if _present(value)\n                }\n            )\n            unit_consistency[target] = units\n            if len(units) > 1:\n                for index in frame.index[\n                    frame[\"test_type\"].astype(str).str.strip().eq(target)\n                ]:\n                    reasons_by_row[index].append(\n                        f\"inconsistent units for {target}: {', '.join(units)}\"\n                    )\n\n    decisions: list[RecordDecision] = []\n    for index, row in frame.iterrows():\n        for field in (\"curing_temperature_c\", \"curing_time_h\"):\n            value = _text(row.get(field, \"\"))\n            if value:\n                try:\n                    parsed = float(value)\n                except (TypeError, ValueError, OverflowError):\n                    parsed = float(\"nan\")\n                invalid = pd.isna(parsed) or parsed in (float(\"inf\"), float(\"-inf\"))\n                if field == \"curing_time_h\" and not pd.isna(parsed) and parsed < 0:\n                    invalid = True\n                if invalid:\n                    reasons_by_row[index].append(\n                        f\"invalid experimental metadata: {field} must be \"\n                        + (\"finite and non-negative\" if field == \"curing_time_h\" else \"finite\")\n                    )\n                    rejected_rows.add(index)\n        measurement_date = _text(row.get(\"measurement_date\", \"\"))\n        if measurement_date:\n            try:\n                if len(measurement_date) != 10:\n                    raise ValueError\n                pd.to_datetime(measurement_date, format=\"%Y-%m-%d\", errors=\"raise\")\n            except (TypeError, ValueError):\n                reasons_by_row[index].append(\n                    \"invalid experimental metadata: measurement_date must use YYYY-MM-DD\"\n                )\n                rejected_rows.add(index)\n        row_reasons = list(dict.fromkeys(reasons_by_row[index]))\n        for field in REVIEW_FIELDS:\n            if not _present(row.get(field, \"\")):\n                row_reasons.append(f\"missing review metadata: {field}\")\n        status = (\n            \"rejected\"\n            if index in rejected_rows\n            else \"review\"\n            if row_reasons\n            else \"accepted\"\n        )\n        decisions.append(\n            RecordDecision(\n                record_id=_text(row.get(\"record_id\", \"\")),\n                specimen_id=_text(row.get(\"specimen_id\", \"\")),\n field in (\"curing_temperature_c\", \"curing_time_h\"):\n            value = _text(row.get(field, \"\"))\n            if value:\n                try:\n                    parsed = float(value)\n                except (TypeError, ValueError, OverflowError):\n                    parsed = float(\"nan\")\n                invalid = pd.isna(parsed) or parsed in (float(\"inf\"), float(\"-inf\"))\n                if field == \"curing_time_h\" and not pd.isna(parsed) and parsed < 0:\n                    invalid = True\n                if invalid:\n                    reasons_by_row[index].append(\n                        f\"invalid experimental metadata: {field} must be \"\n                        + (\"finite and non-negative\" if field == \"curing_time_h\" else \"finite\")\n                    )\n                    rejected_rows.add(index)\n        measurement_date = _text(row.get(\"measurement_date\", \"\"))\n        if measurement_date:\n            try:\n                if len(measurement_date) != 10:\n                    raise ValueError\n                pd.to_datetime(measurement_date, format=\"%Y-%m-%d\", errors=\"raise\")\n            except (TypeError, ValueError):\n                reasons_by_row[index].append(\n                    \"invalid experimental metadata: measurement_date must use YYYY-MM-DD\"\n                )\n                rejected_rows.add(index)\n        row_reasons = list(dict.fromkeys(reasons_by_row[index]))\n        for field in REVIEW_FIELDS:\n            if not _present(row.get(field, \"\")):\n                row_reasons.append(f\"missing review metadata: {field}\")\n        status = (\n            \"rejected\"\n            if index in rejected_rows\n            else \"review\"\n            if row_reasons\n            else \"accepted\"\n        )\n        decisions.append(\n            RecordDecision(\n                record_id=_text(row.get(\"record_id\", \"\")),\n                specimen_id=_text(row.get(\"specimen_id\", \"\")),\n                test_type=_text(row.get(\"test_type\", \"\")),\n                status=status,\n                reasons=tuple(dict.fromkeys(row_reasons)),\n            )\n        )\n\n    target_readiness = {\n        target: _build_target_readiness(frame, decisions, target)\n        for target in sorted(TEST_TYPES)\n    }\n    return ExperimentalQualityReport(\n        source_file=str(source),\n        record_count=len(frame),\n        accepted_count=sum(decision.status == \"accepted\" for decision in decisions),\n        review_count=sum(decision.status == \"review\" for decision in decisions),\n        rejected_count=sum(decision.status == \"rejected\" for decision in decisions),\n        decisions=decisions,\n        target_readiness=target_readiness,\n        dataset_unit_consistency=unit_consistency,\n        raw_file_preserved=True,\n    )\n",
  "src/ecofiber_ai/explainability.py": "\"\"\"Explainability and sensitivity analysis for composite property prediction.\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import asdict, dataclass, field\nfrom pathlib import Path\nfrom typing import Any\n\nimport numpy as np\n\nfrom ecofiber_ai.inference import PredictionInput, predict_property\n\n\n@dataclass\nclass FeatureImportanceItem:\n    \"\"\"Importance score and scientific interpretation for one predictor feature.\"\"\"\n\n    feature: str\n    relative_importance: float\n    effect_direction: str\n    scientific_mechanism: str\n\n\n@dataclass\nclass ExplainabilityReport:\n    \"\"\"Structured report on feature importance and mechanistic attribution.\"\"\"\n\n    target: str\n    is_available: bool\n    status: str\n    source: str\n    importances: list[FeatureImportanceItem] = field(default_factory=list)\n    disclaimer: str = \"\"\n\n    def to_dict(self) -> dict[str, Any]:\n        return asdict(self)\n\n\n@dataclass\nclass SensitivitySweepResult:\n    \"\"\"1D sensitivity curve for a single parameter sweep.\"\"\"\n\n    parameter_name: str\n    parameter_values: list[float]\n    predicted_values: list[float]\n    target: str\n    target_unit: str\n    is_available: bool = True\n    is_demo_benchmark: bool = False\n    disclaimer: str = \"\"\n\n    def to_dict(self) -> dict[str, Any]:\n        return asdict(self)\n\n\ndef compute_feature_importances(\n    target: str,\n    *,\n    allow_demo_benchmark: bool = False,\n) -> ExplainabilityReport:\n    \"\"\"Compute relative feature importance based on verified models or illustrative prior hypotheses.\n\n    If allow_demo_benchmark=False and no verified trained model exists, returns status='unavailable'.\n    If allow_demo_benchmark=True, returns domain-mechanics prior hypotheses from literature,\n    explicitly tagged with source='illustrative_prior_hypothesis'.\n    \"\"\"\n    if not allow_demo_benchmark:\n        return ExplainabilityReport(\n            target=target,\n            is_available=False,\n            status=\"unavailable\",\n            source=\"none\",\n            importances=[],\n            disclaimer=\"Empirical feature importances are unavailable because no verified model is trained on real data.\",\n        )\n\n    # Demo mode: Literature-derived prior mechanistic hypotheses (clearly tagged)\n    if target in {\"tensile_strength\", \"flexural_strength\"}:\n        items = [\n            FeatureImportanceItem(\n                feature=\"fibre_loading_wt_pct\",\n                relative_importance=0.42,\n                effect_direction=\"Parabolic (peaks around 25-35 wt%)\",\n                scientific_mechanism=\"Provides primary load-bearing capacity; excessive loading (>40%) causes fiber agglomeration, dry spots, and stress concentrations.\",\n            ),\n            FeatureImportanceItem(\n                feature=\"naoh_concentration_pct\",\n                relative_importance=0.28,\n                effect_direction=\"Optimal peak around 3-5% NaOH\",\n                scientific_mechanism=\"Alkalization removes amorphous hemicellulose and lignin, increasing fiber roughness and matrix adhesion. Higher concentrations (>8%) induce cellulose degradation and micro-pitting.\",\n            ),\n            FeatureImportanceItem(\n                feature=\"treatment_time_h\",\n                relative_importance=0.18,\n                effect_direction=\"Positive up to 2-6 h, plateau thereafter\",\n                scientific_mechanism=\"Sufficient soaking ensures complete surface dewaxing without excessive fiber swelling or structural weakening.\",\n            ),\n            FeatureImportanceItem(\n                feature=\"fibre_length_mm\",\n                relative_importance=0.12,\n                effect_direction=\"Positive up to critical aspect ratio (~10-15 mm)\",\n                scientific_mechanism=\"Longer fibers allow effective shear stress transfer along the interface up to the critical fiber length.\",\n            ),\n        ]\n    elif target == \"impact_resistance\":\n        items = [\n            FeatureImportanceItem(\n                feature=\"fibre_loading_wt_pct\",\n                relative_importance=0.50,\n                effect_direction=\"Monotonically increasing / leveling off\",\n                scientific_mechanism=\"Fibre pull-out and debonding dissipate impact energy, increasing composite toughness and shock resistance.\",\n            ),\n            FeatureImportanceItem(\n                feature=\"naoh_concentration_pct\",\n                relative_importance=0.25,\n                effect_direction=\"Modest peak around 3-5%\",\n                scientific_mechanism=\"Optimizes fiber-matrix interfacial shear strength without embrittling the cellulosic core.\",\n            ),\n            FeatureImportanceItem(\n                feature=\"fibre_length_mm\",\n                relative_importance=0.15,\n                effect_direction=\"Positive\",\n                scientific_mechanism=\"Longer fibers require more energy to pull out completely from the cracked matrix.\",\n            ),\n            FeatureImportanceItem(\n                feature=\"treatment_time_h\",\n                relative_importance=0.10,\n                effect_direction=\"Moderate influence\",\n                scientific_mechanism=\"Moderate surface clean-up assists wet-out during high strain-rate impact loading.\",\n            ),\n        ]\n    else:  # water_absorption\n        items = [\n            FeatureImportanceItem(\n                feature=\"fibre_loading_wt_pct\",\n                relative_importance=0.58,\n                effect_direction=\"Strongly positive (increasing)\",\n                scientific_mechanism=\"Natural plant fibres are hydrophilic (free hydroxyl -OH groups); adding more fibre increases composite water intake and swelling.\",\n            ),\n            FeatureImportanceItem(\n                feature=\"naoh_concentration_pct\",\n                relative_importance=0.27,\n                effect_direction=\"Negative (reduces absorption)\",\n                scientific_mechanism=\"Alkali treatment dissolves hydrophilic hemicellulose and pectin, reducing moisture uptake and swelling rate.\",\n            ),\n            FeatureImportanceItem(\n                feature=\"treatment_time_h\",\n                relative_importance=0.10,\n                effect_direction=\"Negative (mild reduction)\",\n                scientific_mechanism=\"Longer soaking ensures higher removal of water-absorbing non-cellulosic constituents.\",\n            ),\n            FeatureImportanceItem(\n                feature=\"fibre_length_mm\",\n                relative_importance=0.05,\n                effect_direction=\"Minor effect\",\n                scientific_mechanism=\"Fiber end capillarity contributes slightly to water entry path kinetics.\",\n            ),\n        ]\n\n    return ExplainabilityReport(\n        target=target,\n        is_available=True,\n        status=\"demonstration_prior\",\n        source=\"illustrative_prior_hypothesis\",\n        importances=items,\n        disclaimer=\"DEMONSTRATION ONLY: These relative importance scores represent domain-mechanics literature hypotheses for UI walkthrough. They are NOT empirically learned weights from a trained dataset.\",\n    )\n\n\ndef sweep_parameter(\n    target: str,\n    parameter: str,\n    min_val: float,\n    max_val: float,\n    steps: int = 25,\n    base_input: PredictionInput | None = None,\n    allow_demo_benchmark: bool = False,\n) -> SensitivitySweepResult:\n    \"\"\"Generate 1D parameter sensitivity curve across a specified range.\"\"\"\n    unit = \"MPa\" if \"strength\" in target else \"%\" if target == \"water_absorption\" else \"kJ/m^2\"\n\n    if base_input is None:\n        base_input = PredictionInput(\n            target=target,\n            fibre_loading_wt_pct=30.0,\n            naoh_concentration_pct=4.0,\n            treatment_time_h=4.0,\n            fibre_length_mm=10.0,\n        )\n\n    if not allow_demo_benchmark:\n        # Check if real prediction is possible\n        probe_res = predict_property(base_input, allow_demo_benchmark=False)\n        if not probe_res.is_ready:\n            return SensitivitySweepResult(\n                parameter_name=parameter,\n                parameter_values=[],\n                predicted_values=[],\n                target=target,\n                target_unit=unit,\n                is_available=False,\n                disclaimer=\"Sensitivity sweep unavailable because no verified model is trained for this target.\",\n            )\n\n    values = list(np.linspace(min_val, max_val, steps))\n    preds: list[float] = []\n\n    for val in values:\n        inp = PredictionInput(\n            target=target,\n            fibre_loading_wt_pct=float(val) if parameter == \"fibre_loading_wt_pct\" else base_input.fibre_loading_wt_pct,\n            naoh_concentration_pct=float(val) if parameter == \"naoh_concentration_pct\" else base_input.naoh_concentration_pct,\n            treatment_time_h=float(val) if parameter == \"treatment_time_h\" else base_input.treatment_time_h,\n            fibre_length_mm=float(val) if parameter == \"fibre_length_mm\" else base_input.fibre_length_mm,\n            fibre_type=base_input.fibre_type,\n            matrix_type=base_input.matrix_type,\n            treatment_method=base_input.treatment_method,\n            fibre_form=base_input.fibre_form,\n            fabrication_method=base_input.fabrication_method,\n        )\n        res = predict_property(inp, allow_demo_benchmark=allow_demo_benchmark)\n        preds.append(res.predicted_value if res.predicted_value is not None else 0.0)\n        if res.predicted_unit:\n            unit = res.predicted_unit\n\n    return SensitivitySweepResult(\n        parameter_name=parameter,\n        parameter_values=[round(v, 2) for v in values],\n        predicted_values=preds,\n        target=target,\n        target_unit=unit,\n        is_available=True,\n        is_demo_benchmark=allow_demo_benchmark,\n        disclaimer=(\n            \"DEMO SIMULATION: Sensitivity curve is generated using domain-mechanics reference formulas for demonstration.\"\n            if allow_demo_benchmark\n            else \"Evaluated using verified trained model.\"\n        ),\n    )\n",

  "src/ecofiber_ai/inference.py": "\"\"\"Inference engine with strict readiness verification, bounds checking, and truthful uncertainty estimation.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom dataclasses import asdict, dataclass, field\nfrom pathlib import Path\nfrom typing import Any\n\nimport joblib\nimport numpy as np\nimport pandas as pd\n\nfrom ecofiber_ai.schema import (\n    SUPPORTED_UNITS,\n    TEST_TYPES,\n)\n\n\n@dataclass\nclass PredictionInput:\n    \"\"\"Input parameters for composite property prediction.\"\"\"\n\n    target: str\n    fibre_loading_wt_pct: float\n    naoh_concentration_pct: float = 0.0\n    treatment_time_h: float = 0.0\n    fibre_length_mm: float = 10.0\n    fibre_type: str = \"Ipomoea carnea\"\n    matrix_type: str = \"epoxy\"\n    treatment_method: str = \"alkali (NaOH)\"\n    fibre_form: str = \"short fibre\"\n    fabrication_method: str = \"hand lay-up\"\n\n    def to_dataframe(self) -> pd.DataFrame:\n        \"\"\"Convert input parameters to DataFrame matching model preprocessor format.\"\"\"\n        return pd.DataFrame(\n            [\n                {\n                    \"naoh_concentration_pct\": float(self.naoh_concentration_pct),\n                    \"treatment_time_h\": float(self.treatment_time_h),\n                    \"fibre_loading_wt_pct\": float(self.fibre_loading_wt_pct),\n                    \"fibre_length_mm\": float(self.fibre_length_mm),\n                    \"fibre_type\": str(self.fibre_type),\n                    \"matrix_type\": str(self.matrix_type),\n                    \"treatment_method\": str(self.treatment_method),\n                    \"fibre_form\": str(self.fibre_form),\n                    \"fabrication_method\": str(self.fabrication_method),\n                }\n            ]\n        )\n\n\n@dataclass\nclass InputValidationResult:\n    \"\"\"Validation findings for prediction input.\"\"\"\n\n    is_valid: bool\n    errors: list[str] = field(default_factory=list)\n    warnings: list[str] = field(default_factory=list)\n\n\n@dataclass\nclass PredictionResult:\n    \"\"\"Structured result of a property prediction request.\"\"\"\n\n    target: str\n    is_ready: bool\n    status: str\n    predicted_value: float | None = None\n    predicted_unit: str | None = None\n    lower_bound_95: float | None = None\n    upper_bound_95: float | None = None\n    model_name: str | None = None\n    model_metrics: dict[str, float | None] = field(default_factory=dict)\n    limitations: list[str] = field(default_factory=list)\n    validation_warnings: list[str] = field(default_factory=list)\n    reasons_unready: list[str] = field(default_factory=list)\n    is_demo_benchmark: bool = False\n\n    def to_dict(self) -> dict[str, Any]:\n        return asdict(self)\n\n\ndef validate_prediction_input(params: PredictionInput) -> InputValidationResult:\n    \"\"\"Validate numerical bounds and categorical consistency of formulation inputs.\"\"\"\n    errors: list[str] = []\n    warnings: list[str] = []\n\n    if params.target not in TEST_TYPES:\n        errors.append(f\"Target '{params.target}' is unsupported. Choose from: {', '.join(sorted(TEST_TYPES))}.\")\n\n    # Numeric bounds\n    if params.fibre_loading_wt_pct < 0.0 or params.fibre_loading_wt_pct > 100.0:\n        errors.append(f\"fibre_loading_wt_pct ({params.fibre_loading_wt_pct}%) must be between 0.0% and 100.0%.\")\n    elif params.fibre_loading_wt_pct > 45.0:\n        warnings.append(\n            f\"Fibre loading of {params.fibre_loading_wt_pct}% is unusually high for hand lay-up composites (typically 10-40%).\"\n        )\n\n    if params.naoh_concentration_pct < 0.0 or params.naoh_concentration_pct > 100.0:\n        errors.append(f\"naoh_concentration_pct ({params.naoh_concentration_pct}%) must be between 0.0% and 100.0%.\")\n    elif params.naoh_concentration_pct > 10.0:\n        warnings.append(\n            f\"NaOH concentration of {params.naoh_concentration_pct}% may cause excessive fibre degradation and cellulose damage.\"\n        )\n\n    if params.treatment_time_h < 0.0:\n        errors.append(f\"treatment_time_h ({params.treatment_time_h} h) must be non-negative.\")\n\n    if params.fibre_length_mm <= 0.0:\n        errors.append(f\"fibre_length_mm ({params.fibre_length_mm} mm) must be greater than 0.\")\n\n    # Domain consistency\n    if params.naoh_concentration_pct > 0.0 and params.treatment_time_h == 0.0:\n        warnings.append(\"NaOH concentration is specified > 0%, but treatment duration is 0 h.\")\n\n    if \"ipomoea\" not in params.fibre_type.lower():\n        warnings.append(\n            f\"Fibre type '{params.fibre_type}' differs from standard target species 'Ipomoea carnea'.\"\n        )\n\n    if \"epoxy\" not in params.matrix_type.lower():\n        warnings.append(\n            f\"Matrix type '{params.matrix_type}' differs from standard baseline matrix 'epoxy'.\"\n        )\n\n    return InputValidationResult(\n        is_valid=len(errors) == 0,\n        errors=errors,\n        warnings=warnings,\n    )\n\n\ndef predict_property(\n    params: PredictionInput,\n    *,\n    project_root: str | Path = \".\",\n    model_dir: str | Path | None = None,\n    allow_demo_benchmark: bool = False,\n) -> PredictionResult:\n    \"\"\"Predict composite property with strict readiness check and domain validation.\n\n    If real trained model exists and data readiness gates pass, generates authentic prediction\n    with genuine holdout metrics and uncertainty.\n    If real data is insufficient and allow_demo_benchmark=False, returns clear 'not_ready'\n    result with scientific diagnostic reasons.\n    If allow_demo_benchmark=True is explicitly requested, returns a simulated reference\n    tagged with is_demo_benchmark=True, and with confidence intervals/metrics set to None\n    to avoid presenting fabricated statistical measures.\n    \"\"\"\n    root = Path(project_root).resolve()\n    val = validate_prediction_input(params)\n    if not val.is_valid:\n        return PredictionResult(\n            target=params.target,\n            is_ready=False,\n            status=\"invalid_input\",\n            reasons_unready=val.errors,\n            validation_warnings=val.warnings,\n        )\n\n    canonical_unit_name = next(iter(SUPPORTED_UNITS[params.target]))\n    model_directory = Path(model_dir) if model_dir is not None else root / \"models\"\n    model_file = model_directory / f\"{params.target}_dummy_baseline.joblib\"\n    report_file = root / \"data\" / \"processed\" / \"models\" / f\"{params.target}_baseline_report.json\"\n\n    # Check if a genuine trained model exists\n    if model_file.is_file() and report_file.is_file():\n        try:\n            report_data = json.loads(report_file.read_text(encoding=\"utf-8\"))\n            if report_data.get(\"status\") == \"evaluated\":\n                pipeline = joblib.load(model_file)\n                df = params.to_dataframe()\n                raw_pred = float(pipeline.predict(df)[0])\n\n                metrics = report_data.get(\"metrics\", {}).get(\"dummy_mean\", {})\n                rmse = metrics.get(\"rmse\")\n                lower = round(max(0.0, raw_pred - 1.96 * rmse), 2) if rmse is not None else None\n                upper = round(raw_pred + 1.96 * rmse, 2) if rmse is not None else None\n\n                return PredictionResult(\n                    target=params.target,\n                    is_ready=True,\n                    status=\"predicted\",\n                    predicted_value=round(raw_pred, 2),\n                    predicted_unit=canonical_unit_name,\n                    lower_bound_95=lower,\n                    upper_bound_95=upper,\n                    model_name=\"Baseline Grouped Model\",\n                    model_metrics=metrics,\n                    limitations=report_data.get(\"limitations\", []) + [\n                        \"Screening baseline only; does not establish broad generalization.\",\n                        \"All predictions must be validated with physical laboratory testing.\",\n                    ],\n                    validation_warnings=val.warnings,\n                )\n        except Exception:\n            pass\n\n    # When no scientific model exists, check if demo simulation mode is requested\n    if allow_demo_benchmark:\n        est_val = _simulate_demo_benchmark_value(params)\n        return PredictionResult(\n            target=params.target,\n            is_ready=True,\n            status=\"demo_benchmark\",\n            predicted_value=round(est_val, 2),\n            predicted_unit=canonical_unit_name,\n            lower_bound_95=None,  # No fabricated confidence intervals without real data\n            upper_bound_95=None,\n            model_name=\"Software Demo Benchmark (Simulated Physics-Informed Reference)\",\n            model_metrics={},  # No fabricated holdout metrics\n            limitations=[\n                \"DEMO BENCHMARK ONLY: Generated for software walkthrough and UI testing.\",\n                \"Confidence intervals and holdout metrics are omitted because no empirical holdout evaluation exists.\",\n                \"Not a certified scientific prediction for physical fabrication.\",\n                \"Real Ipomoea carnea dataset remains in 'not ready' state awaiting verified laboratory measurements.\",\n            ],\n            validation_warnings=val.warnings,\n            is_demo_benchmark=True,\n        )\n\n    # Standard real-world response: scientific integrity preserved, model not ready\n    return PredictionResult(\n        target=params.target,\n        is_ready=False,\n        status=\"not_ready\",\n        predicted_unit=canonical_unit_name,\n        validation_warnings=val.warnings,\n        reasons_unready=[\n            f\"No verified scientific model is trained for '{params.target}'.\",\n            \"Literature register has 0 accepted directly comparable observations for Ipomoea carnea composites.\",\n            \"Requires >= 12 compatible observations and >= 4 independent batch groups.\",\n            \"Raw experimental measurements have not yet been recorded in data/raw/experimental/.\",\n        ],\n        limitations=[\n            \"EcoFiber AI refuses to fabricate predictions without verified experimental evidence.\",\n            \"Add verified laboratory observations in data/raw/experimental/ to train a valid model.\",\n        ],\n    )\n\n\ndef _simulate_demo_benchmark_value(params: PredictionInput) -> float:\n    \"\"\"Physics-informed reference benchmark value for software demonstration.\"\"\"\n    loading = params.fibre_loading_wt_pct\n    naoh = params.naoh_concentration_pct\n    time_h = params.treatment_time_h\n\n    # Chemical treatment factor (optimum ~ 3-5% NaOH, 2-8 hours)\n    if naoh > 0:\n        treatment_factor = 1.0 + 0.25 * float(np.exp(-((naoh - 4.0) ** 2) / 8.0)) * min(1.0, time_h / 4.0)\n    else:\n        treatment_factor = 1.0\n\n    if params.target == \"tensile_strength\":\n        matrix_base = 38.0\n        loading_effect = 25.0 * (loading / 30.0) * float(np.exp(-max(0.0, loading - 30.0) / 20.0))\n        return float((matrix_base + loading_effect) * treatment_factor)\n    elif params.target == \"flexural_strength\":\n        matrix_base = 50.0\n        loading_effect = 30.0 * (loading / 30.0) * float(np.exp(-max(0.0, loading - 30.0) / 20.0))\n        return float((matrix_base + loading_effect) * treatment_factor)\n    elif params.target == \"impact_resistance\":\n        matrix_base = 12.0\n        loading_effect = 15.0 * (loading / 35.0)\n        return float((matrix_base + loading_effect) * treatment_factor)\n    else:  # water_absorption (%)\n        fibre_hydrophilicity = 0.12 * (1.0 - 0.3 * min(1.0, naoh / 5.0))\n        return float(0.5 + loading * fibre_hydrophilicity)\n",
  "ecofiber_ai/inference.py": "\"\"\"Inference engine with strict readiness verification, bounds checking, and truthful uncertainty estimation.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom dataclasses import asdict, dataclass, field\nfrom pathlib import Path\nfrom typing import Any\n\nimport joblib\nimport numpy as np\nimport pandas as pd\n\nfrom ecofiber_ai.schema import (\n    SUPPORTED_UNITS,\n    TEST_TYPES,\n)\n\n\n@dataclass\nclass PredictionInput:\n    \"\"\"Input parameters for composite property prediction.\"\"\"\n\n    target: str\n    fibre_loading_wt_pct: float\n    naoh_concentration_pct: float = 0.0\n    treatment_time_h: float = 0.0\n    fibre_length_mm: float = 10.0\n    fibre_type: str = \"Ipomoea carnea\"\n    matrix_type: str = \"epoxy\"\n    treatment_method: str = \"alkali (NaOH)\"\n    fibre_form: str = \"short fibre\"\n    fabrication_method: str = \"hand lay-up\"\n\n    def to_dataframe(self) -> pd.DataFrame:\n        \"\"\"Convert input parameters to DataFrame matching model preprocessor format.\"\"\"\n        return pd.DataFrame(\n            [\n                {\n                    \"naoh_concentration_pct\": float(self.naoh_concentration_pct),\n                    \"treatment_time_h\": float(self.treatment_time_h),\n                    \"fibre_loading_wt_pct\": float(self.fibre_loading_wt_pct),\n                    \"fibre_length_mm\": float(self.fibre_length_mm),\n                    \"fibre_type\": str(self.fibre_type),\n                    \"matrix_type\": str(self.matrix_type),\n                    \"treatment_method\": str(self.treatment_method),\n                    \"fibre_form\": str(self.fibre_form),\n                    \"fabrication_method\": str(self.fabrication_method),\n                }\n            ]\n        )\n\n\n@dataclass\nclass InputValidationResult:\n    \"\"\"Validation findings for prediction input.\"\"\"\n\n    is_valid: bool\n    errors: list[str] = field(default_factory=list)\n    warnings: nd cellulose damage.\"\n        )\n\n    if params.treatment_time_h < 0.0:\n        errors.append(f\"treatment_time_h ({params.treatment_time_h} h) must be non-negative.\")\n\n    if params.fibre_length_mm <= 0.0:\n        errors.append(f\"fibre_length_mm ({params.fibre_length_mm} mm) must be greater than 0.\")\n\n    # Domain consistency\n    if params.naoh_concentration_pct > 0.0 and params.treatment_time_h == 0.0:\n        warnings.append(\"NaOH concentration is specified > 0%, but treatment duration is 0 h.\")\n\n    if \"ipomoea\" not in params.fibre_type.lower():\n        warnings.append(\n            f\"Fibre type '{params.fibre_type}' differs from standard target species 'Ipomoea carnea'.\"\n        )\n\n    if \"epoxy\" not in params.matrix_type.lower():\n        warnings.append(\n            f\"Matrix type '{params.matrix_type}' differs from standard baseline matrix 'epoxy'.\"\n        )\n\n    return InputValidationResult(\n        is_valid=len(errors) == 0,\n        errors=errors,\n        warnings=warnings,\n    )\n\n\ndef predict_property(\n    params: PredictionInput,\n    *,\n    project_root: str | Path = \".\",\n    model_dir: str | Path | None = None,\n    allow_demo_benchmark: bool = False,\n) -> PredictionResult:\n    \"\"\"Predict composite property with strict readiness check and domain validation.\n\n    If real trained model exists and data readiness gates pass, generates authentic prediction\n    with genuine holdout metrics and uncertainty.\n    If real data is insufficient and allow_demo_benchmark=False, returns clear 'not_ready'\n    result with scientific diagnostic reasons.\n    If allow_demo_benchmark=True is explicitly requested, returns a simulated reference\n    tagged with is_demo_benchmark=True, and with confidence intervals/metrics set to None\n    to avoid presenting fabricated statistical measures.\n    \"\"\"\n    root = Path(project_root).resolve()\n    val = validate_prediction_input(params)\n    if not val.is_valid:\n        return PredictionResult(\n            target=params.target,\n            is_ready=False,\n            status=\"invalid_input\",\n            reasons_unready=val.errors,\n            validation_warnings=val.warnings,\n        )\n\n    canonical_unit_name = next(iter(SUPPORTED_UNITS[params.target]))\n    model_directory = Path(model_dir) if model_dir is not None else root / \"models\"\n    model_file = model_directory / f\"{params.target}_dummy_baseline.joblib\"\n    report_file = root / \"data\" / \"processed\" / \"models\" / f\"{params.target}_baseline_report.json\"\n\n    # Check if a genuine trained model exists\n    if model_file.is_file() and report_file.is_file():\n        try:\n            report_data = json.loads(report_file.read_text(encoding=\"utf-8\"))\n            if report_data.get(\"status\") == \"evaluated\":\n                pipeline = joblib.load(model_file)\n                df = params.to_dataframe()\n                raw_pred = float(pipeline.predict(df)[0])\n\n                metrics = report_data.get(\"metrics\", {}).get(\"dummy_mean\", {})\n                rmse = metrics.get(\"rmse\")\n                lower = round(max(0.0, raw_pred - 1.96 * rmse), 2) if rmse is not None else None\n                upper = round(raw_pred + 1.96 * rmse, 2) if rmse is not None else None\n\n                return PredictionResult(\n                    target=params.target,\n                    is_ready=True,\n                    status=\"predicted\",\n                    predicted_value=round(raw_pred, 2),\n                    predicted_unit=canonical_unit_name,\n                    lower_bound_95=lower,\n                    upper_bound_95=upper,\n                    model_name=\"Baseline Grouped Model\",\n                    model_metrics=metrics,\n                    limitations=report_data.get(\"limitations\", []) + [\n                        \"Screening baseline only; does not establish broad generalization.\",\n                        \"All predictions must be validated with physical laboratory testing.\",\n                    ],\n                    validation_warnings=val.warnings,\n                )\n        except Exception:\n            pass\n\n    # When no scientific model exists, check if demo simulation mode is requested\n    if allow_demo_benchmark:\n        est_val = _simulate_demo_benchmark_value(params)\n        return PredictionResult(\n            target=params.target,\n            is_ready=True,\n            status=\"demo_benchmark\",\n            predicted_value=round(est_val, 2),\n            predicted_unit=canonical_unit_name,\n            lower_bound_95=None,  # No fabricated confidence intervals without real data\n            upper_bound_95=None,\n            model_name=\"Software Demo Benchmark (Simulated Physics-Informed Reference)\",\n            model_metrics={},  # No fabricated holdout metrics\n            limitations=[\n                \"DEMO BENCHMARK ONLY: Generated for software walkthrough and UI testing.\",\n                \"Confidence intervals and holdout metrics are omitted because no empirical holdout evaluation exists.\",\n                \"Not a certified scientific prediction for physical fabrication.\",\n                \"Real Ipomoea carnea dataset remains in 'not ready' state awaiting verified laboratory measurements.\",\n            ],\n            validation_warnings=val.warnings,\n            is_demo_benchmark=True,\n        )\n\n    # Standard real-world response: scientific integrity preserved, model not ready\n    return PredictionResult(\n        target=params.target,\n        is_ready=False,\n        status=\"not_ready\",\n        predicted_unit=canonical_unit_name,\n        validation_warnings=val.warnings,\n        reasons_unready=[\n            f\"No verified scientific model is trained for '{params.target}'.\",\n            \"Literature register has 0 accepted directly comparable observations for Ipomoea carnea composites.\",\n            \"Requires >= 12 compatible observations and >= 4 independent batch groups.\",\n            \"Raw experimental measurements have not yet been recorded in data/raw/experimental/.\",\n        ],\n        limitations=[\n            \"EcoFiber AI refuses to fabricate predictions without verified experimental evidence.\",\n            \"Add verified laboratory observations in data/raw/experimental/ to train a valid model.\",\n        ],\n    )\n\n\ndef _simulate_demo_benchmark_value(params: PredictionInput) -> float:\n    \"\"\"Physics-informed reference benchmark value for software demonstration.\"\"\"\n    loading = params.fibre_loading_wt_pct\n    naoh = params.naoh_concentration_pct\n    time_h = params.treatment_time_h\n\n    # Chemical treatment factor (optimum ~ 3-5% NaOH, 2-8 hours)\n    if naoh > 0:\n        treatment_factor = 1.0 + 0.25 * float(np.exp(-((naoh - 4.0) ** 2) / 8.0)) * min(1.0, time_h / 4.0)\n    else:\n        treatment_factor = 1.0\n\n    if params.target == \"tensile_strength\":\n        matrix_base = 38.0\n        loading_effect = 25.0 * (loading / 30.0) * float(np.exp(-max(0.0, loading - 30.0) / 20.0))\n        return float((matrix_base + loading_effect) * treatment_factor)\n    elif params.target == \"flexural_strength\":\n        matrix_base = 50.0\n        loading_effect = 30.0 * (loading / 30.0) * float(np.exp(-max(0.0, loading - 30.0) / 20.0))\n        return float((matrix_base + loading_effect) * treatment_factor)\n    elif params.target == \"impact_resistance\":\n        matrix_base = 12.0\n        loading_effect = 15.0 * (loading / 35.0)\n        return float((matrix_base + loading_effect) * treatment_factor)\n    else:  # water_absorption (%)\n        fibre_hydrophilicity = 0.12 * (1.0 - 0.3 * min(1.0, naoh / 5.0))\n        return float(0.5 + loading * fibre_hydrophilicity)\n",
  "src/ecofiber_ai/literature.py": "\"\"\"Source-register and literature-observation review workflow.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport math\nimport re\nfrom dataclasses import asdict, dataclass\nfrom datetime import date\nfrom pathlib import Path\nfrom typing import Any\n\nimport pandas as pd\n\nfrom ecofiber_ai.schema import SUPPORTED_UNITS, TEST_TYPES, canonical_unit\nfrom ecofiber_ai.validation import CSVLoadError, load_csv, validate_dataframe\nfrom ecofiber_ai.audit import MINIMUM_INDEPENDENT_GROUPS, MINIMUM_MODEL_RECORDS\n\nSOURCE_REGISTER_COLUMNS = (\n    \"source_id\",\n    \"title\",\n    \"authors\",\n    \"publication_year\",\n    \"journal\",\n    \"doi\",\n    \"url\",\n    \"metadata_source\",\n    \"access_level\",\n    \"fibre_type\",\n    \"fibre_preparation\",\n    \"matrix_type\",\n    \"treatment_method\",\n    \"naoh_concentration_pct\",\n    \"fibre_loading_wt_pct\",\n    \"fibre_length_mm\",\n    \"fabrication_method\",\n    \"test_methods\",\n    \"test_standards\",\n    \"reported_properties\",\n    \"compatibility_category\",\n    \"verification_status\",\n    \"review_status\",\n    \"review_notes\",\n    \"extraction_confidence\",\n    \"access_url\",\n    \"access_date\",\n)\nREVIEW_STATUSES = frozenset({\"pending\", \"accepted\", \"rejected\"})\nCOMPATIBILITY_CATEGORIES = frozenset(\n    {\n        \"directly comparable\",\n        \"conditionally comparable\",\n        \"context only\",\n        \"rejected\",\n    }\n)\nVERIFICATION_STATUSES = frozenset(\n    {\"unverified\", \"metadata_verified\", \"abstract_inspected\", \"full_text_inspected\"}\n)\nACCESS_LEVELS = frozenset({\"metadata_only\", \"abstract_inspected\", \"full_text_inspected\"})\nEXTRACTION_TYPES = frozenset(\n    {\n        \"individual\",\n        \"reported_mean\",\n        \"reported_range\",\n        \"reported_value\",\n        \"graph_estimate\",\n        \"inferred\",\n    }\n)\nMODEL_ELIGIBLE_EXTRACTION_TYPES = frozenset(\n    {
