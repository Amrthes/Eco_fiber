readiness['status']}.\"\n                    )\n            lines.append(\"\")\n\n        lit = self.literature_summary\n        lines.extend(\n            [\n                \"## Literature evidence\",\n                \"\",\n                f\"- Registered sources: {lit['sources_discovered']}\",\n                f\"- Metadata-verified: {lit['metadata_verified']}\",\n                f\"- Abstract inspected: {lit['abstract_inspected']}\",\n                f\"- Full text inspected: {lit['full_text_inspected']}\",\n                f\"- Extracted observations: {lit['observation_count']}\",\n                f\"- Provenance-complete observations: {lit['provenance_complete_observations']}\",\n                f\"- Accepted sources: {lit['sources_accepted']}\",\n                \"\",\n                \"## Target readiness\",\n                \"\",\n                \"| Target | Experimental rows / accepted | Unique specimen IDs by file | Batch groups by file | Units by file | Literature rows / accepted compatible | Independent literature groups | Status |\",\n                \"|---|---:|---|---|---|---:|---:|---|\",\n            ]\n        )\n        for target in sorted(TEST_TYPES):\n            item = self.targets[target]\n            exp_rows = item[\"experimental\"]\n            exp_value = (\n                f\"{exp_rows['observation_count']} / \"\n                f\"{exp_rows['accepted_observation_count']}\"\n            )\n            specimens = \", \".join(\n                f\"`{path}`: {count}\"\n                for path, count in exp_rows[\"unique_specimen_counts_by_file\"].items()\n            ) or \"none\"\n            batches = \", \".join(\n                f\"`{path}`: {count}\"\n                for path, count in exp_rows[\"batch_groups_by_file\"].items()\n            ) or \"none\"\n            units = \", \".join(\n                f\"`{path}`: {', '.join(values) or 'none'}\"\n                for path, values in exp_rows[\"units_by_file\"].items()\n            ) or \"none\"\n            lit_value = (\n                f\"{item['literature']['observation_count']} / \"\n                f\"{item['literature']['accepted_compatible_count']}\"\n            )\n            status = \"not ready\" if not item[\"model_request_candidate\"] else (\n                \"candidate; explicit model review still required\"\n            )\n            lines.append(\n                f\"| `{target}` | {exp_value} | {specimens} | {batches} | {units} \"\n                f\"| {lit_value} | {item['literature']['independent_groups']} \"\n                f\"| {status} |\"\n            )\n        lines.extend([\"\", \"### Readiness reasons\", \"\"])\n        for target in sorted(TEST_TYPES):\n            item = self.targets[target]\n            reasons = item[\"reasons\"] or [\n                \"Existing data/readiness checks passed; the model command has not been run.\"\n            ]\n            lines.append(f\"- `{target}`: \" + \"; \".join(reasons))\n        lines.extend(\n            [\n                \"\",\n                \"## Interpretation and next steps\",\n                \"\",\n                \"Experimental files and literature observations are assessed \"\n                \"separately; this report does not pool them. Separate raw files \"\n                \"are not combined to meet the model thresholds. A candidate \"\n                \"status is not a trained model or scientific validation.\",\n                \"\",\n                \"For each desired target, enter real specimen-level measurements \"\n                \"with traceable source, fibre/matrix/treatment/loading, fabrication \"\n                \"and test-standard metadata; validate and review them; and meet \"\n                \"the unchanged gates below. A single raw CSV is evaluated at a \"\n                \"time; separate sources are not pooled by this demo.\",\n                \"\",\n                \"Current model gates: \"\n                f\"{self.training_gates['minimum_compatible_observations']} compatible \"\n                f\"observations; {self.training_gates['minimum_independent_groups']} \"\n                f\"independent source/batch groups; at least \"\n                f\"{self.training_gates['minimum_train_records']} training and \"\n                f\"{self.training_gates['minimum_test_records']} holdout observations.\",\n                \"\",\n                \"No illustrative values are used in this report.\",\n                \"\",\n            ]\n        )\n        return \"\\n\".join(lines)\n\n    def write(self, directory: str | Path) -> tuple[Path, Path]:\n        destination = Path(directory)\n        destination.mkdir(parents=True, exist_ok=True)\n        markdown = destination / \"readiness_report.md\"\n        json_path = destination / \"readiness_report.json\"\n        markdown.write_text(self.to_markdown(), encoding=\"utf-8\")\n        json_path.write_text(\n            json.dumps(self.to_dict(), indent=2, ensure_ascii=False) + \"\\n\",\n            encoding=\"utf-8\",\n        )\n        return markdown, json_path\n\n\ndef _relative(path: Path, root: Path) -> str:\n    try:\n        return str(path.resolve().relative_to(root.resolve()))\n    except ValueError:\n        return str(path)\n\n\ndef _metadata_counts(literature: LiteratureReview) -> dict[str, Any]:\n    counts = literature.verification_counts\n    return {\n        \"sources_discovered\": literature.sources_discovered,\n        \"metadata_verified\": counts.get(\"metadata_verified\", 0),\n        \"abstract_inspected\": counts.get(\"abstract_inspected\", 0),\n        \"full_text_inspected\": counts.get(\"full_text_inspected\", 0),\n        \"sources_accepted\": literature.sources_accepted,\n        \"observation_count\": literature.observation_count,\n        \"provenance_complete_observations\": literature.provenance_complete_observations,\n    }\n\n\ndef build_readiness_report(project_root: str | Path = \".\") -> ReadinessReport:\n    \"\"\"Refresh linked reports and summarize real-data readiness; never trains.\"\"\"\n    root = Path(project_root).resolve()\n    processed = root / \"data\" / \"processed\"\n    audit: DatasetAudit = audit_datasets(root)\n    audit_path = audit.write_markdown(processed / \"dataset_audit.md\")\n\n    literature = review_literature(root)\n    literature_dir = processed / \"literature-review\"\n    literature_markdown, _ = literature.write(literature_dir)\n\n    experimental_audits = [\n        item for item in audit.files if item.area == \"raw_experimental\"\n    ]\n    experimental_files: list[dict[str, Any]] = []\n    experimental_reports: list[str] = []\n    experimental_by_target: dict[str, list[tuple[FileAudit, ExperimentalQualityReport]]] = {\n        target: [] for target in TEST_TYPES\n    }\n    if experimental_audits:\n        for file_audit in experimental_audits:\n            source = root / Path(file_audit.path)\n            try:\n                quality = review_experimental_csv(source)\n            except CSVLoadError as exc:\n                experimental_files.append(\n                    {\n                        \"path\": file_audit.path,\n                        \"record_count\": file_audit.record_count,\n                        \"accepted_count\": 0,\n                        \"review_count\": 0,\n                        \"rejected_count\": 0,\n                        \"test_fixture_marked\": file_audit.test_fixture_marked,\n                        \"error\": str(exc),\n                        \"target_readiness\": {},\n                    }\n                )\n                continue\n            report_dir = (\n                processed\n                / \"experimental-review\"\n                / Path(file_audit.path).with_suffix(\"\").name\n            )\n            markdown_path, _ = quality.write(report_dir)\n            experimental_reports.append(_relative(markdown_path, root))\n            experimental_files.append(\n                {\n                    \"path\": file_audit.path,\n                    \"record_count\": quality.record_count,\n                    \"accepted_count\": quality.accepted_count,\n                    \"review_count\": quality.review_count,\n                    \"rejected_count\": quality.rejected_count,\n                    \"test_fixture_marked\": file_audit.test_fixture_marked,\n                    \"target_readiness\": quality.target_readiness,\n                }\n            )\n            for target in TEST_TYPES:\n                experimental_by_target[target].append((file_audit, quality))\n    else:\n        template = root / \"data\" / \"templates\" / \"experimental_observations_template.csv\"\n        if template.is_file():\n            quality = review_experimental_csv(template)\n            markdown_path, _ = quality.write(processed / \"experimental-review\")\n            experimental_reports.append(_relative(markdown_path, root))\n\n    literature_observations_path = (\n        root / \"data\" / \"raw\" / \"literature\" / \"literature_observations.csv\"\n    )\n    literature_observations = pd.DataFrame()\n    literature_observation_error: str | None = None\n    if literature_observations_path.is_file():\n        try:\n            literature_observations = load_csv(literature_observations_path)\n        except CSVLoadError as exc:\n            literature_observation_error = str(exc)\n\n    target_summaries: dict[str, dict[str, Any]] = {}\n    for target in sorted(TEST_TYPES):\n        row_count = accepted_count = 0\n        specimen_counts: dict[str, int] = {}\n        batch_counts: dict[str, int] = {}\n        units_by_file: dict[str, list[str]] = {}\n        experimental_reasons: list[str] = []\n        experimental_candidate = False\n        for file_audit, quality in experimental_by_target[target]:\n            item = quality.target_readiness[target]\n            file_path = file_audit.path\n            row_count += item[\"observation_count\"]\n            accepted_count += item[\"accepted_observation_count\"]\n            specimen_counts[file_path] = item[\"unique_specimen_count\"]\n            batch_counts[file_path] = item[\"independent_group_count\"]\n            units_by_file[file_path] = item[\"units\"]\n            if not file_audit.modelling_readiness.get(target, {}).get(\"eligible\", False):\n                experimental_reasons.extend(\n                    file_audit.modelling_readiness.get(target, {}).get(\n                        \"reasons\", [\"existing audit did not consider the file eligible\"]\n                    )\n                )\n            if item[\"status\"] != \"potentially ready\":\n                experimental_reasons.extend(item[\"reasons\"])\n            if (\n                item[\"status\"] == \"potentially ready\"\n                and file_audit.modelling_readiness.get(target, {}).get(\"eligible\", False)\n                and not file_audit.test_fixture_marked\n            ):\n                experimental_candidate = True\n\n        lit_ready = literature.readiness[target]\n        lit_units: list[str] = []\n        target_observation_count = 0\n        if {\"test_type\", \"measured_unit\"}.issubset(literature_observations.columns):\n            lit_target = literature_observations.loc[\n                literature_observations[\"test_type\"].astype(str).str.strip().eq(target)\n            ]\n            target_observation_count = len(lit_target)\n            lit_units = sorted(\n                {\n                    canonical_unit(str(value).strip()) or str(value).strip()\n                    for value in lit_target[\"measured_unit\"].tolist()\n                    if str(value).strip()\n                }\n            )\n        literature_candidate = bool(lit_ready[\"eligible\"])\n        reasons = list(dict.fromkeys(experimental_reasons))\n        reasons.extend(\n            f\"literature: {reason}\" for reason in lit_ready[\"reasons\"]\n        )\n        if not experimental_by_target[target] and row_count == 0:\n            reasons[:0] = [\n                \"no raw experimental observations are available\",\n                f\"experimental modelling requires at least {MINIMUM_MODEL_RECORDS} \"\n                \"compatible observations and \"\n                f\"{MINIMUM_INDEPENDENT_GROUPS} independent source/batch groups\",\n            ]\n        if literature.observation_count == 0:\n            reasons.append(\"literature observation table contains no extracted measurements\")\n        if literature_observation_error:\n            reasons.append(\n                \"literature observation table could not be read: \"\n                + literature_observation_error\n            )\n        target_summaries[target] = {\n            \"experimental\": {\n                \"observation_count\": row_count,\n                \"accepted_observation_count\": accepted_count,\n                \"unique_specimen_counts_by_file\": specimen_counts,\n                \"batch_groups_by_file\": batch_counts,\n                \"units_by_file\": units_by_file,\n            },\n            \"literature\": {\n                \"observation_count\": target_observation_count,\n                \"accepted_compatible_count\": literature.compatible_observations_by_target.get(\n                    target, 0\n                ),\n                \"independent_groups\": lit_ready[\"independent_groups\"],\n                \"units\": lit_units,\n            },\n            \"model_request_candidate\": experimental_candidate or literature_candidate,\n            \"reasons\": list(dict.fromkeys(reasons)),\n        }\n\n    status = (\n        \"Readiness report generated; no target is ready for a model request.\"\n        if not any(item[\"model_request_candidate\"] for item in target_summaries.values())\n        else \"Some target(s) meet current data checks; no model was run.\"\n    )\n    return ReadinessReport(\n        project_root=str(root),\n        audit_report=_relative(audit_path, root),\n        literature_report=_relative(literature_markdown, root),\n        experimental_reports=experimental_reports,\n        experimental_files=experimental_files,\n        literature_summary=_metadata_counts(literature),\n        targets=target_summaries,\n        training_gates={\n            \"minimum_compatible_observations\": MINIMUM_MODEL_RECORDS,\n            \"minimum_independent_groups\": MINIMUM_INDEPENDENT_GROUPS,\n            \"minimum_train_records\": MINIMUM_TRAIN_RECORDS,\n            \"minimum_test_records\": MINIMUM_TEST_RECORDS,\n        },\n        demo_status=status,\n    )\n",
  "ecofiber_ai/readiness.py": "\"\"\"End-to-end, non-training readiness report for the EcoFiber AI demo.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nfrom dataclasses import asdict, dataclass\nfrom pathlib import Path\nfrom typing import Any\n\nimport pandas as pd\n\nfrom ecofiber_ai.audit import (\n    MINIMUM_INDEPENDENT_GROUPS,\n    MINIMUM_MODEL_RECORDS,\n    DatasetAudit,\n    FileAudit,\n    audit_datasets,\n)\nfrom ecofiber_ai.experimental import (\n    ExperimentalQualityReport,\n    review_experimental_csv,\n)\nfrom ecofiber_ai.literature import LiteratureReview, review_literature\nfrom ecofiber_ai.modeling import MINIMUM_TEST_RECORDS, MINIMUM_TRAIN_RECORDS\nfrom ecofiber_ai.schema import TEST_TYPES, canonical_unit\nfrom ecofiber_ai.validation import CSVLoadError, load_csv\n\n\n@dataclass\nclass ReadinessReport:\n    \"\"\"Traceable snapshot of data availability without fitting a model.\"\"\"\n\n    project_root: str\n    audit_report: str\n    literature_report: str\n    experimental_reports: list[str]\n    experimental_files: list[dict[str, Any]]\n    literature_summary: dict[str, Any]\n    targets: dict[str, dict[str, Any]]\n    training_gates: dict[str, int]\n    demo_status: str\n    model_training_performed: bool = False\n\n    def to_dict(self) -> dict[str, Any]:\n        return asdict(self)\n\n    def to_markdown(self) -> str:\n        lines = [\n            \"# EcoFiber AI end-to-end readiness\",\n            \"\",\n            f\"- Project root: `{self.project_root}`\",\n            \"- This command performs readiness checks only; no model was trained \"\n            \"and no prediction was generated.\",\n            f\"- Demo status: **{self.demo_status}**\",\n            f\"- Dataset audit: `{self.audit_report}`\",\n            f\"- Literature review: `{self.literature_report}`\",\n            \"\",\n            \"## Experimental data\",\n            \"\",\n        ]\n        if not self.experimental_files:\n            lines.extend(\n                [\n                    \"No raw experimental observation CSVs were found. The \"\n                    \"header-only template is not a dataset.\",\n                    \"Accepted: 0; requires review: 0; rejected: 0.\",\n                    \"\",\n                ]\n            )\n        else:\n            lines.extend(\n                [\n                    \"| File | Rows | Accepted | Review | Rejected |\",\n                    \"|---|---:|---:|---:|---:|\",\n                ]\n            )\n            for item in self.experimental_files:\n                lines.append(\n                    f\"| `{item['path']}` | {item['record_count']} | \"\n                    f\"{item['accepted_count']} | {item['review_count']} | \"\n                    f\"{item['rejected_count']} |\"\n                )\n            lines.append(\"\")\n            lines.extend([\"### Experimental file review details\", \"\"])\n            for item in self.experimental_files:\n                lines.append(f\"- `{item['path']}`\")\n                if item.get(\"error\"):\n                    lines.append(f\"  - Review error: {item['error']}\")\n                for target, readiness in item.get(\"target_readiness\", {}).items():\n                    missing = \", \".join(\n                        f\"{field}: {count}\"\n                        for field, count in readiness[\"missing_metadata_counts\"].items()\n                        if count\n                    ) or \"none\"\n                    lines.append(\n                        f\"  - `{target}`: {readiness['observation_count']} rows; \"\n                        f\"{readiness['accepted_observation_count']} accepted; \"\n                        f\"{readiness['unique_specimen_count']} specimen IDs; \"\n                        f\"{readiness['independent_group_count']} batch IDs; \"\n                        f\"units {', '.join(readiness['units']) or 'none'}; \"\n                        f\"missing metadata: {missing}; {readiness['status']}.\"\n                    )\n            lines.append(\"\")\n\n        lit = self.literature_summary\n        lines.extend(\n            [\n                \"## Literature evidence\",\n                \"\",\n                f\"- Registered sources: {lit['sources_discovered']}\",\n                f\"- Metadata-verified: {lit['metadata_verified']}\",\n                f\"- Abstract inspected: {lit['abstract_inspected']}\",\n                f\"- Full text inspected: {lit['full_text_inspected']}\",\n                f\"- Extracted observations: {lit['observation_count']}\",\n                f\"- Provenance-complete observations: {lit['provenance_complete_observations']}\",\n                f\"- Accepted sources: {lit['sources_accepted']}\",\n                \"\",\n                \"## Target readiness\",\n                \"\",\n                \"| Target | Experimental rows / accepted | Unique specimen IDs by file | Batch groups by file | Units by file | Literature rows / accepted compatible | Independent literature groups | Status |\",\n                \"|---|---:|---|---|---|---:|---:|---|\",\n            ]\n        )\n        for target in sorted(TEST_TYPES):\n            item = self.targets[target]\n            exp_rows = item[\"experimental\"]\n            exp_value = (\n                f\"{exp_rows['observation_count']} / \"\n                f\"{exp_rows['accepted_observation_count']}\"\n            )\n            specimens = \", \".join(\n                f\"`{path}`: {count}\"\n                for path, count in exp_rows[\"unique_specimen_counts_by_file\"].items()\n            ) or \"none\"\n            batches = \", \".join(\n                f\"`{path}`: {count}\"\n                for path, count in exp_rows[\"batch_groups_by_file\"].items()\n            ) or \"none\"\n            units = \", \".join(\n                f\"`{path}`: {', '.join(values) or 'none'}\"\n                for path, values in exp_rows[\"units_by_file\"].items()\n            ) or \"none\"\n            lit_value = (\n                f\"{item['literature']['observation_count']} / \"\n                f\"{item['literature']['accepted_compatible_count']}\"\n            )\n            status = \"not ready\" if not item[\"model_request_candidate\"] else (\n                \"candidate; explicit model review still required\"\n            )\n            lines.append(\n                f\"| `{target}` | {exp_value} | {specimens} | {batches} | {units} \"\n                f\"| {lit_value} | {item['literature']['independent_groups']} \"\n                f\"| {status} |\"\n            )\n        lines.extend([\"\", \"### Readiness reasons\", \"\"])\n        for target in sorted(TEST_TYPES):\n            item = self.targets[target]\n            reasons = item[\"reasons\"] or [\n                \"Existing data/readiness checks passed; the model command has not been run.\"\n            ]\n            lines.append(f\"- `{target}`: \" + \"; \".join(reasons))\n        lines.extend(\n            [\n                \"\",\n                \"## Interpretation and next steps\",\n                \"\",\n                \"Experimental files and literature observations are assessed \"\n                \"separately; this report does not pool them. Separate raw files \"\n                \"are not combined to meet the model thresholds. A candidate \"\n                \"status is not a trained model or scientific validation.\",\n                \"\",\n                \"For each desired target, enter real specimen-level measurements \"\n                \"with traceable source, fibre/matrix/treatment/loading, fabrication \"\n                \"and test-standard metadata; validate and review them; and meet \"\n                \"the unchanged gates below. A single raw CSV is evaluated at a \"\n                \"time; separate sources are not pooled by this demo.\",\n                \"\",\n                \"Current model gates: \"\n                f\"{self.training_gates['minimum_compatible_observations']} compatible \"\n                f\"observations; {self.training_gates['minimum_independent_groups']} \"\n                f\"independent source/batch groups; at least \"\n                f\"{self.training_gates['minimum_train_records']} training and \"\n                f\"{self.training_gates['minimum_test_records']} holdout observations.\",\n                \"\",\n                \"No illustrative values are used in this report.\",\n                \"\",\n            ]\n        )\n        return \"\\n\".join(lines)\n\n    def write(self, directory: str | Path) -> tuple[Path, Path]:\n        destination = Path(directory)\n        destination.mkdir(parents=True, exist_ok=True)\n        markdown = destination / \"readiness_report.md\"\n        json_path = destination / \"readiness_report.json\"\n        markdown.write_text(self.to_markdown(), encoding=\"utf-8\")\n        json_path.write_text(\n            json.dumps(self.to_dict(), indent=2, ensure_ascii=False) + \"\\n\",\n            encoding=\"utf-8\",\n        )\n        return markdown, json_path\n\n\ndef _relative(path: Path, root: Path) -> str:\n    try:\n        return str(path.resolve().relative_to(root.resolve()))\n    except ValueError:\n        return str(path)\n\n\ndef _metadata_counts(literature: LiteratureReview) -> dict[str, Any]:\n    counts = literature.verification_counts\n    return {\n        \"sources_discovered\": literature.sources_discovered,\n        \"metadata_verified\": counts.get(\"metadata_verified\", 0),\n        \"abstract_inspected\": counts.get(\"abstract_inspected\", 0),\n        \"full_text_inspected\": counts.get(\"full_text_inspected\", 0),\n        \"sources_accepted\": literature.sources_accepted,\n        \"observation_count\": literature.observation_count,\n        \"provenance_complete_observations\": literature.provenance_complete_observations,\n    }\n\n\ndef build_readiness_report(project_root: str | Path = \".\") -> ReadinessReport:\n    \"\"\"Refresh linked reports and summarize real-data readiness; never trains.\"\"\"\n    root = Path(project_root).resolve()\n    processed = root / \"data\" / \"processed\"\n    audit: DatasetAudit = audit_datasets(root)\n    audit_path = audit.write_markdown(processed / \"dataset_audit.md\")\n\n    literature = review_literature(root)\n    literature_dir = processed / \"literature-review\"\n    literature_markdown, _ = literature.write(literature_dir)\n\n    experimental_audits = [\n        item for item in audit.files if item.area == \"raw_experimental\"\n    ]\n    experimental_files: list[dict[str, Any]] = []\n    experimental_reports: list[str] = []\n    experimental_by_target: dict[str, list[tuple[FileAudit, ExperimentalQualityReport]]] = {\n        target: [] for target in TEST_TYPES\n    }\n    if experimental_audits:\n        for file_audit in experimental_audits:\n            source = root / Path(file_audit.path)\n            try:\n                quality = review_experimental_csv(source)\n            except CSVLoadError as exc:\n                experimental_files.append(\n                    {\n                        \"path\": file_audit.path,\n                        \"record_count\": file_audit.record_count,\n                        \"accepted_count\": 0,\n                        \"review_count\": 0,\n                        \"rejected_count\": 0,\n                        \"test_fixture_marked\": file_audit.test_fixture_marked,\n                        \"error\": str(exc),\n                        \"target_readiness\": {},\n                    }\n                )\n                continue\n            report_dir = (\n                processed\n                / \"experimental-review\"\n                / Path(file_audit.path).with_suffix(\"\").name\n            )\n            markdown_path, _ = quality.write(report_dir)\n            experimental_reports.append(_relative(markdown_path, root))\n            experimental_files.append(\n                {\n                    \"path\": file_audit.path,\n                    \"record_count\": quality.record_count,\n                    \"accepted_count\": quality.accepted_count,\n                    \"review_count\": quality.review_count,\n                    \"rejected_count\": quality.rejected_count,\n                    \"test_fixture_marked\": file_audit.test_fixture_marked,\n                    \"target_readiness\": quality.target_readiness,\n                }\n            )\n            for target in TEST_TYPES:\n                experimental_by_target[target].append((file_audit, quality))\n    else:\n        template = root / \"data\" / \"templates\" / \"experimental_observations_template.csv\"\n        if template.is_file():\n            quality = review_experimental_csv(template)\n            markdown_path, _ = quality.write(processed / \"experimental-review\")\n            experimental_reports.append(_relative(markdown_path, root))\n\n    literature_observations_path = (\n        root / \"data\" / \"raw\" / \"literature\" / \"literature_observations.csv\"\n    )\n    literature_observations = pd.DataFrame()\n    literature_observation_error: str | None = None\n    if literature_observations_path.is_file():\n        try:\n            literature_observations = load_csv(literature_observations_path)\n        except CSVLoadError as exc:\n            literature_observation_error = str(exc)\n\n    target_summaries: dict[str, dict[str, Any]] = {}\n    for target in sorted(TEST_TYPES):\n        row_count = accepted_count = 0\n        specimen_counts: dict[str, int] = {}\n        batch_counts: dict[str, int] = {}\n        units_by_file: dict[str, list[str]] = {}\n        experimental_reasons: list[str] = []\n        experimental_candidate = False\n        for file_audit, quality in experimental_by_target[target]:\n            item = quality.target_readiness[target]\n            file_path = file_audit.path\n            row_count += item[\"observation_count\"]\n            accepted_count += item[\"accepted_observation_count\"]\n            specimen_counts[file_path] = item[\"unique_specimen_count\"]\n            batch_counts[file_path] = item[\"independent_group_count\"]\n            units_by_file[file_path] = item[\"units\"]\n            if not file_audit.modelling_readiness.get(target, {}).get(\"eligible\", False):\n                experimental_reasons.extend(\n                    file_audit.modelling_readiness.get(target, {}).get(\n                        \"reasons\", [\"existing audit did not consider the file eligible\"]\n                    )\n                )\n            if item[\"status\"] != \"potentially ready\":\n                experimental_reasons.extend(item[\"reasons\"])\n            if (\n                item[\"status\"] == \"potentially ready\"\n                and file_audit.modelling_readiness.get(target, {}).get(\"eligible\", False)\n                and not file_audit.test_fixture_marked\n            ):\n                experimental_candidate = True\n\n        lit_ready = literature.readiness[target]\n        lit_units: list[str] = []\n        target_observation_count = 0\n        if {\"test_type\", \"measured_unit\"}.issubset(literature_observations.columns):\n            lit_target = literature_observations.loc[\n                literature_observations[\"test_type\"].astype(str).str.strip().eq(target)\n            ]\n            target_observation_count = len(lit_target)\n            lit_units = sorted(\n                {\n                    canonical_unit(str(value).strip()) or str(value).strip()\n                    for value in lit_target[\"measured_unit\"].tolist()\n                    if str(value).strip()\n                }\n            )\n        literature_candidate = bool(lit_ready[\"eligible\"])\n        reasons = list(dict.fromkeys(experimental_reasons))\n        reasons.extend(\n            f\"literature: {reason}\" for reason in lit_ready[\"reasons\"]\n        )\n        if not experimental_by_target[target] and row_count == 0:\n            reasons[:0] = [\n                \"no raw experimental observations are available\",\n                f\"experimental modelling requires at least {MINIMUM_MODEL_RECORDS} \"\n                \"compatible observations and \"\n                f\"{MINIMUM_INDEPENDENT_GROUPS} independent source/batch groups\",\n            ]\n        if literature.observation_count == 0:\n            reasons.append(\"literature observation table contains no extracted measurements\")\n        if literature_observation_error:\n            reasons.append(\n                \"literature observation table could not be read: \"\n                + literature_observation_error\n            )\n        target_summaries[target] = {\n            \"experimental\": {\n                \"observation_count\": row_count,\n                \"accepted_observation_count\": accepted_count,\n                \"unique_specimen_counts_by_file\": specimen_counts,\n                \"batch_groups_by_file\": batch_counts,\n                \"units_by_file\": units_by_file,\n            },\n            \"literature\": {\n                \"observation_count\": target_observation_count,\n                \"accepted_compatible_count\": literature.compatible_observations_by_target.get(\n                    target, 0\n                ),\n                \"independent_groups\": lit_ready[\"independent_groups\"],\n                \"units\": lit_units,\n            },\n            \"model_request_candidate\": experimental_candidate or literature_candidate,\n            \"reasons\": list(dict.fromkeys(reasons)),\n        }\n\n    status = (\n        \"Readiness report generated; no target is ready for a model request.\"\n        if not any(item[\"model_request_candidate\"] for item in target_summaries.values())\n        else \"Some target(s) meet current data checks; no model was run.\"\n    )\n    return ReadinessReport(\n        project_root=str(root),\n        audit_report=_relative(audit_path, root),\n        literature_report=_relative(literature_markdown, root),\n        experimental_reports=experimental_reports,\n        experimental_files=experimental_files,\n        literature_summary=_metadata_counts(literature),\n        targets=target_summaries,\n        training_gates={\n            \"minimum_compatible_observations\": MINIMUM_MODEL_RECORDS,\n            \"minimum_independent_groups\": MINIMUM_INDEPENDENT_GROUPS,\n            \"minimum_train_records\": MINIMUM_TRAIN_RECORDS,\n            \"minimum_test_records\": MINIMUM_TEST_RECORDS,\n        },\n        demo_status=status,\n    )\n",
  "src/ecofiber_ai/schema.py": "\"\"\"Canonical observation schema and property-specific unit definitions.\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import Final\n\nCANONICAL_COLUMNS: Final[tuple[str, ...]] = (\n    \"record_id\",\n    \"source_type\",\n    \"source_id\",\n    \"publication_title\",\n    \"doi_or_url\",\n    \"fibre_type\",\n    \"matrix_type\",\n    \"treatment_method\",\n    \"naoh_concentration_pct\",\n    \"treatment_time_h\",\n    \"fibre_loading_wt_pct\",\n    \"fibre_length_mm\",\n    \"fibre_form\",\n    \"fabrication_method\",\n    \"test_type\",\n    \"test_standard\",\n    \"measured_value\",\n    \"measured_unit\",\n    \"specimen_id\",\n    \"batch_id\",\n    \"notes\",\n)\n\nREQUIRED_COLUMNS: Final[tuple[str, ...]] = (\n    \"record_id\",\n    \"source_type\",\n    \"source_id\",\n    \"test_type\",\n    \"measured_value\",\n    \"measured_unit\",\n)\n\nTEXT_COLUMNS: Final[tuple[str, ...]] = tuple(\n    column\n    for column in CANONICAL_COLUMNS\n    if column\n    not in {\n        \"naoh_concentration_pct\",\n        \"treatment_time_h\",\n        \"fibre_loading_wt_pct\",\n        \"fibre_length_mm\",\n        \"measured_value\",\n    }\n)\n\nNUMERIC_COLUMNS: Final[tuple[str, ...]] = (\n    \"naoh_concentration_pct\",\n    \"treatment_time_h\",\n    \"fibre_loading_wt_pct\",\n    \"fibre_length_mm\",\n    \"measured_value\",\n)\n\nOPTIONAL_NUMERIC_CONSTRAINTS: Final[dict[str, tuple[float, float | None]]] = {\n    \"naoh_concentration_pct\": (0.0, 100.0),\n    \"treatment_time_h\": (0.0, None),\n    \"fibre_loading_wt_pct\": (0.0, 100.0),\n    \"fibre_length_mm\": (0.0, None),\n}\n\nTEST_TYPES: Final[frozenset[str]] = frozenset(\n    {\n        \"tensile_strength\",\n        \"flexural_strength\",\n        \"impact_resistance\",\n        \"water_absorption\",\n    }\n)\n\n_UNIT_ALIASES: Final[dict[str, str]] = {\n    \"mpa\": \"MPa\",\n    \"kj/m2\": \"kJ/m^2\",\n    \"kj/m^2\": \"kJ/m^2\",\n    \"kj/m\u00b2\": \"kJ/m^2\",\n    \"j/m\": \"J/m\",\n    \"%\": \"%\",\n}\n\nSUPPORTED_UNITS: Final[dict[str, frozenset[str]]] = {\n    \"tensile_strength\": frozenset({\"MPa\"}),\n    \"flexural_strength\": frozenset({\"MPa\"}),\n    \"impact_resistance\": frozenset({\"kJ/m^2\", \"J/m\"}),\n    \"water_absorption\": frozenset({\"%\"}),\n}\n\n\ndef canonical_unit(value: str) -> str | None:\n    \"\"\"Return the canonical spelling for a recognized unit, or ``None``.\"\"\"\n    return _UNIT_ALIASES.get(value.strip().casefold())\n",
  "ecofiber_ai/schema.py": "\"\"\"Canonical observation schema and property-specific unit definitions.\"\"\"\n\nfrom __future__ import annotations\n\nfrom typing import Final\n\nCANONICAL_COLUMNS: Final[tuple[str, ...]] = (\n    \"record_id\",\n    \"source_type\",\n    \"source_id\",\n    \"publication_title\",\n    \"doi_or_url\",\n    \"fibre_type\",\n    \"matrix_type\",\n    \"treatment_method\",\n    \"naoh_concentration_pct\",\n    \"treatment_time_h\",\n    \"fibre_loading_wt_pct\",\n    \"fibre_length_mm\",\n    \"fibre_form\",\n    \"fabrication_method\",\n    \"test_type\",\n    \"test_standard\",\n    \"measured_value\",\n    \"measured_unit\",\n    \"specimen_id\",\n    \"batch_id\",\n    \"notes\",\n)\n\nREQUIRED_COLUMNS: Final[tuple[str, ...]] = (\n    \"record_id\",\n    \"source_type\",\n    \"source_id\",\n    \"test_type\",\n    \"measured_value\",\n    \"measured_unit\",\n)\n\nTEXT_COLUMNS: Final[tuple[str, ...]] = tuple(\n    column\n    for column in CANONICAL_COLUMNS\n    if column\n    not in {\n        \"naoh_concentration_pct\",\n        \"treatment_time_h\",\n        \"fibre_loading_wt_pct\",\n        \"fibre_length_mm\",\n        \"measured_value\",\n    }\n)\n\nNUMERIC_COLUMNS: Final[tuple[str, ...]] = (\n    \"naoh_concentration_pct\",\n    \"treatment_time_h\",\n    \"fibre_loading_wt_pct\",\n    \"fibre_length_mm\",\n    \"measured_value\",\n)\n\nOPTIONAL_NUMERIC_CONSTRAINTS: Final[dict[str, tuple[float, float | None]]] = {\n    \"naoh_concentration_pct\": (0.0, 100.0),\n    \"treatment_time_h\": (0.0, None),\n    \"fibre_loading_wt_pct\": (0.0, 100.0),\n    \"fibre_length_mm\": (0.0, None),\n}\n\nTEST_TYPES: Final[frozenset[str]] = frozenset(\n    {\n        \"tensile_strength\",\n        \"flexural_strength\",\n        \"impact_resistance\",\n        \"water_absorption\",\n    }\n)\n\n_UNIT_ALIASES: Final[dict[str, str]] = {\n    \"mpa\": \"MPa\",\n    \"kj/m2\": \"kJ/m^2\",\n    \"kj/m^2\": \"kJ/m^2\",\n    \"kj/m\u00b2\": \"kJ/m^2\",\n    \"j/m\": \"J/m\",\n    \"%\": \"%\",\n}\n\nSUPPORTED_UNITS: Final[dict[str, frozenset[str]]] = {\n    \"tensile_strength\": frozenset({\"MPa\"}),\n    \"flexural_strength\": frozenset({\"MPa\"}),\n    \"impact_resistance\": frozenset({\"kJ/m^2\", \"J/m\"}),\n    \"water_absorption\": frozenset({\"%\"}),\n}\n\n\ndef canonical_unit(value: str) -> str | None:\n    \"\"\"Return the canonical spelling for a recognized unit, or ``None``.\"\"\"\n    return _UNIT_ALIASES.get(value.strip().casefold())\n",
  "src/ecofiber_ai/validation.py": "\"\"\"CSV loading, record validation, and machine-readable validation reports.\"\"\"\n\nfrom __future__ import annotations\n\nimport json\nimport math\nfrom dataclasses import asdict, dataclass, field\nfrom pathlib import Path\nfrom typing import Any\n\nimport pandas as pd\n\nfrom ecofiber_ai.schema import (\n    CANONICAL_COLUMNS,\n    NUMERIC_COLUMNS,\n    OPTIONAL_NUMERIC_CONSTRAINTS,\n    REQUIRED_COLUMNS,\n    SUPPORTED_UNITS,\n    TEXT_COLUMNS,\n    TEST_TYPES,\n    canonical_unit,\n)\n\n\n@dataclass(frozen=True)\nclass ValidationIssue:\n    \"\"\"One actionable validation finding.\"\"\"\n\n    severity: str\n    code: str\n    message: str\n    record_id: str | None = None\n    column: str | None = None\n\n\n@dataclass\nclass ValidationReport:\n    \"\"\"Validation findings and record counts for one input dataset.\"\"\"\n\n    source_file: str | None\n    record_count: int = 0\n    valid_record_count: int = 0\n    invalid_record_count: int = 0\n    errors: list[ValidationIssue] = field(default_factory=list)\n    warnings: list[ValidationIssue] = field(default_factory=list)\n\n    @property\n    def is_valid(self) -> bool:\n        \"\"\"Whether the dataset has no validation errors.\"\"\"\n        return not self.errors\n\n    def to_dict(self) -> dict[str, Any]:\n        \"\"\"Serialize the report for JSON output.\"\"\"\n        return {\n            \"source_file\": self.source_file,\n            \"record_count\": self.record_count,\n            \"valid_record_count\": self.valid_record_count,\n            \"invalid_record_count\": self.invalid_record_count,\n            \"is_valid\": self.is_valid,\n            \"errors\": [asdict(issue) for issue in self.errors],\n            \"warnings\": [asdict(issue) for issue in self.warnings],\n        }\n\n    def write_json(self, path: str | Path) -> Path:\n        \"\"\"Write this report as UTF-8 JSON and return the destination.\"\"\"\n        destination = Path(path)\n        destination.parent.mkdir(parents=True, exist_ok=True)\n        destination.write_text(\n            json.dumps(self.to_dict(), indent=2, ensure_ascii=False) + \"\\n\",\n            encoding=\"utf-8\",\n        )\n        return destination\n\n\nclass CSVLoadError(ValueError):\n    \"\"\"Raised when an input CSV cannot be loaded safely.\"\"\"\n\n\ndef load_csv(path: str | Path) -> pd.DataFrame:\n    \"\"\"Load a UTF-8 CSV, preserving field text and identifier spelling.\n\n    Reading all columns as strings prevents identifiers such as ``0007`` from\n    being silently converted to numbers. Measurement values are parsed during\n    validation instead. Malformed or unreadable CSVs raise ``CSVLoadError``.\n    \"\"\"\n    source = Path(path)\n    try:\n        return pd.read_csv(source, dtype=\"string\", keep_default_na=False)\n    except (OSError, UnicodeError, pd.errors.ParserError, pd.errors.EmptyDataError) as exc:\n        raise CSVLoadError(f\"Could not read CSV '{source}': {exc}\") from exc\n\n\ndef _is_blank(value: Any) -> bool:\n    return pd.isna(value) or (isinstance(value, str) and not value.strip())\n\n\ndef _issue(\n    report: ValidationReport,\n    severity: str,\n    code: str,\n    message: str,\n    *,\n    record_id: str | None = None,\n    column: str | None = None,\n) -> None:\n    issue = ValidationIssue(severity, code, message, record_id, column)\n    (report.errors if severity == \"error\" else report.warnings).append(issue)\n\n\ndef validate_dataframe(\n    dataframe: pd.DataFrame, *, source_file: str | None = None\n) -> ValidationReport:\n    \"\"\"Validate a tidy measurement table without modifying or dropping rows.\n\n    The required metadata columns must exist. Optional canonical columns may be\n    absent or blank; blank optional metadata is reported as warnings. Every\n    input row remains represented in the report counts and is left untouched.\n    \"\"\"\n    report = ValidationReport(source_file=source_file, record_count=len(dataframe))\n    if dataframe.empty:\n        _issue(\n            report,\n            \"error\",\n            \"empty_dataset\",\n            \"The CSV contains no observation records.\",\n        )\n    missing_columns = [name for name in REQUIRED_COLUMNS if name not in dataframe.columns]\n    for column in missing_columns:\n        _issue(\n            report,\n            \"error\",\n            \"missing_required_column\",\n            f\"Required column '{column}' is missing.\",\n            column=column,\n        )\n\n    for column in CANONICAL_COLUMNS:\n        if column not in REQUIRED_COLUMNS and column not in dataframe.columns:\n            _issue(\n                report,\n                \"warning\",\n                \"optional_column_absent\",\n                f\"Optional metadata column '{column}' is absent.\",\n                column=column,\n            )\n\n    if missing_columns:\n        report.invalid_record_count = len(dataframe)\n        return report\n\n    row_error_count: dict[int, int] = {index: 0 for index in range(len(dataframe))}\n    seen_record_ids: dict[str, int] = {}\n    seen_rows: set[tuple[Any, ...]] = set()\n    source_types: set[str] = set()\n\n    for position, (_, row) in enumerate(dataframe.iterrows()):\n        raw_id = row[\"record_id\"]\n        record_id = None if _is_blank(raw_id) else str(raw_id).strip()\n        for column in REQUIRED_COLUMNS:\n            if _is_blank(row[column]):\n                row_error_count[position] += 1\n                _issue(\n                    report,\n                    \"error\",\n                    \"missing_required_value\",\n                    f\"Required value in '{column}' is blank.\",\n                    record_id=record_id,\n                    column=column,\n                )\n\n        for column in TEXT_COLUMNS:\n            if column in dataframe.columns and not _is_blank(row[column]):\n                if not isinstance(row[column], str):\n                    row_error_count[position] += 1\n                    _issue(\n                        report,\n                        \"error\",\n                        \"invalid_text_value\",\n                        f\"'{column}' must be text.\",\n                        record_id=record_id,\n                        column=column,\n                    )\n\n        if record_id is not None:\n            if record_id in seen_record_ids:\n                row_error_count[position] += 1\n                _issue(\n                    report,\n                    \"error\",\n                    \"duplicate_record_id\",\n                    f\"record_id '{record_id}' also appears in row \"\n                    f\"{seen_record_ids[record_id] + 2} (CSV line numbering).\",\n                    record_id=record_id,\n                    column=\"record_id\",\n                )\n            else:\n                seen_record_ids[record_id] = position\n\n        row_tuple = tuple(\n            None if _is_blank(value) else str(value).strip()\n            for value in row.tolist()\n        )\n        if row_tuple in seen_rows:\n            _issue(\n                report,\n                \"warning\",\n                \"duplicate_record\",\n                \"This row duplicates an earlier complete row.\",\n                record_id=record_id,\n            )\n        else:\n            seen_rows.add(row_tuple)\n\n        source_type = \"\" if _is_blank(row[\"source_type\"]) else str(row[\"source_type\"]).strip()\n        if source_type and source_type not in {\"experimental\", \"literature\"}:\n            row_error_count[position] += 1\n            _issue(\n                report,\n                \"error\",\n                \"invalid_source_type\",\n                \"source_type must be 'experimental' or 'literature'.\",\n                record_id=record_id,\n                column=\"source_type\",\n            )\n        elif source_type:\n            source_types.add(source_type)\n\n        test_type = \"\" if _is_blank(row[\"test_type\"]) else str(row[\"test_type\"]).strip()\n        if test_type and test_type not in TEST_TYPES:\n            row_error_count[position] += 1\n            _issue(\n                report,\n                \"error\",\n                \"unsupported_test_type\",\n                f\"Unsupported test_type '{test_type}'.\",\n                record_id=record_id,\n                column=\"test_type\",\n            )\n\n        numeric_values: dict[str, float] = {}\n        for column in NUMERIC_COLUMNS:\n            if column not in dataframe.columns or _is_blank(row[column]):\n                continue\n            try:\n                number = float(row[column])\n            except (TypeError, ValueError, OverflowError):\n                number = math.nan\n            if not math.isfinite(number):\n                row_error_count[position] += 1\n                _issue(\n                    report,\n                    \"error\",\n                    \"invalid_numeric_value\",\n                    f\"'{column}' must be a finite numeric value.\",\n                    record_id=record_id,\n                    column=column,\n                )\n                continue\n            numeric_values[column] = number\n\n            if column in OPTIONAL_NUMERIC_CONSTRAINTS:\n                minimum, maximum = OPTIONAL_NUMERIC_CONSTRAINTS[column]\n                below_minimum = (\n                    number <= minimum\n                    if column == \"fibre_length_mm\"\n                    else number < minimum\n                )\n                if below_minimum or (maximum is not None and number > maximum):\n                    row_error_count[position] += 1\n                    if column == \"fibre_length_mm\":\n                        bound = \"greater than 0\"\n                    elif maximum is not None:\n                        bound = f\"between {minimum:g} and {maximum:g}\"\n                    else:\n                        bound = f\"at least {minimum:g}\"\n                    _issue(\n                        report,\n                        \"error\",\n                        \"numeric_out_of_range\",\n                        f\"'{column}' must be {bound}.\",\n                        record_id=record_id,\n                        column=column,\n                    )\n\n        measured_value = numeric_values.get(\"measured_value\")\n        if measured_value is not None and test_type in TEST_TYPES:\n            minimum = 0.0 if test_type in {\"impact_resistance\", \"water_absorption\"} else 0.0\n            if measured_value < minimum or (\n                test_type in {\"tensile_strength\", \"flexural_strength\"}\n                and measured_value == minimum\n            ):\n                row_error_count[position] += 1\n                _issue(\n                    report,\n                    \"error\",\n                    \"invalid_measurement_range\",\n                    (\n                        \"Strength measurements must be greater than zero; impact \"\n                        \"resistance and water absorption must be zero or greater.\"\n                    ),\n                    record_id=record_id,\n                    column=\"measured_value\",\n                )\n\n        unit = \"\" if _is_blank(row[\"measured_unit\"]) else str(row[\"measured_unit\"]).strip()\n        canonical = canonical_unit(unit) if unit else None\n        if test_type in SUPPORTED_UNITS and unit:\n            if canonical not in SUPPORTED_UNITS[test_type]:\n                row_error_count[position] += 1\n                allowed = \", \".join(sorted(SUPPORTED_UNITS[test_type]))\n                _issue(\n                    report,\n                    \"error\",\n                    \"unsupported_unit\",\n                    f\"Unit '{unit}' is not supported for {test_type}; use {allowed}.\",\n                    record_id=record_id,\n                    column=\"measured_unit\",\n                )\n\n        optional_metadata = {\n            column: (\n                row[column]\n                if column in dataframe.columns\n                else None\n            )\n            for column in (\"fibre_type\", \"matrix_type\", \"test_standard\")\n        }\n        for column, value in optional_metadata.items():\n            if _is_blank(value):\n                _issue(\n                    report,\n                    \"warning\",\n                    \"metadata_missing\",\n                    f\"'{column}' is blank; compatibility cannot be fully assessed.\",\n                    record_id=record_id,\n                    column=column,\n                )\n\n        if source_type == \"literature\":\n            title = row.get(\"publication_title\", \"\")\n            citation = row.get(\"doi_or_url\", \"\")\n            if _is_blank(title) and _is_blank(citation):\n                _issue(\n                    report,\n                    \"warning\",\n                    \"literature_citation_missing\",\n                    \"Literature records should include publication_title and/or doi_or_url.\",\n                    record_id=record_id,\n                    column=\"doi_or_url\",\n                )\n\n    if len(source_types) > 1:\n        _issue(\n            report,\n            \"error\",\n            \"mixed_source_types\",\n            \"A source CSV must contain either experimental or literature records, not both.\",\n            column=\"source_type\",\n        )\n        for position in row_error_count:\n            row_error_count[position] += 1\n\n    report.invalid_record_count = sum(count > 0 for count in row_error_count.values())\n    report.valid_record_count = report.record_count - report.invalid_record_count\n    return report\n\n\ndef validate_csv(path: str | Path) -> tuple[pd.DataFrame, ValidationReport]:\n    \"\"\"Load and validate a CSV, returning the original table and its report.\"\"\"\n    dataframe = load_csv(path)\n    return dataframe, validate_dataframe(dataframe, source_file=str(Path(path)))\n",

ional_metadata = {\n            column: (\n                row[column]\n                if column in dataframe.columns\n                else None\n            )\n            for column in (\"fibre_type\", \"matrix_type\", \"test_standard\")\n        }\n        for column, value in optional_metadata.items():\n            if _is_blank(value):\n                _issue(\n                    report,\n                    \"warning\",\n                    \"metadata_missing\",\n                    f\"'{column}' is blank; compatibility cannot be fully assessed.\",\n                    record_id=record_id,\n                    column=column,\n                )\n\n        if source_type == \"literature\":\n            title = row.get(\"publication_title\", \"\")\n            citation = row.get(\"doi_or_url\", \"\")\n            if _is_blank(title) and _is_blank(citation):\n                _issue(\n                    report,\n                    \"warning\",\n                    \"literature_citation_missing\",\n                    \"Literature records should include publication_title and/or doi_or_url.\",\n                    record_id=record_id,\n                    column=\"doi_or_url\",\n                )\n\n    if len(source_types) > 1:\n        _issue(\n            report,\n            \"error\",\n            \"mixed_source_types\",\n            \"A source CSV must contain either experimental or literature records, not both.\",\n            column=\"source_type\",\n        )\n        for position in row_error_count:\n            row_error_count[position] += 1\n\n    report.invalid_record_count = sum(count > 0 for count in row_error_count.values())\n    report.valid_record_count = report.record_count - report.invalid_record_count\n    return report\n\n\ndef validate_csv(path: str | Path) -> tuple[pd.DataFrame, ValidationReport]:\n    \"\"\"Load and validate a CSV, returning the original table and its report.\"\"\"\n    dataframe = load_csv(path)\n    return dataframe, validate_dataframe(dataframe, source_file=str(Path(path)))\n",

ature/\",\n    )\n    model.add_argument(\n        \"--unit\",\n        help=\"select one accepted target unit when multiple compatible unit groups exist\",\n    )\n    model.add_argument(\n        \"--project-root\",\n        type=Path,\n        default=Path(\".\"),\n        help=\"project root containing data/ (default: current directory)\",\n    )\n    model.add_argument(\n        \"--output-dir\",\n        type=Path,\n        default=Path(\"data/processed/models\"),\n        help=\"JSON report directory (default: data/processed/models)\",\n    )\n    model.add_argument(\n        \"--model-dir\",\n        type=Path,\n        default=Path(\"models\"),\n        help=\"trained baseline model directory (default: models)\",\n    )\n    literature = commands.add_parser(\n        \"literature\", help=\"review source provenance and curated literature observations\"\n    )\n    literature_commands = literature.add_subparsers(\n        dest=\"literature_command\", required=True\n    )\n    literature_review = literature_commands.add_parser(\n        \"review\", help=\"validate the source register and report extraction readiness\"\n    )\n    literature_review.add_argument(\n        \"--project-root\",\n        type=Path,\n        default=Path(\".\"),\n        help=\"project root containing data/ (default: current directory)\",\n    )\n    literature_review.add_argument(\n        \"--register\",\n        type=Path,\n        help=\"source-register CSV (default: data/raw/literature/source_register.csv)\",\n    )\n    literature_review.add_argument(\n        \"--observations\",\n        type=Path,\n        help=\"extracted observations CSV (default: data/raw/literature/literature_observations.csv)\",\n    )\n    literature_review.add_argument(\n        \"--output-dir\",\n        type=Path,\n        default=Path(\"data/processed/literature-review\"),\n        help=\"report directory (default: data/processed/literature-review)\",\n    )\n    experimental = commands.add_parser(\n
